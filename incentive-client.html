<script>
  function incentiveState() {
    if (!appState.incentive) appState.incentive = { setupSeq: 0, seq: 0, setup: null, report: null };
    return appState.incentive;
  }
  function incentiveText(id, text) {
    var el = document.getElementById(id); if (!el) return;
    el.textContent = text; el.setAttribute('data-loading', text === 'Sedang memuat data' ? 'true' : 'false');
  }
  function incentiveStatus(message, loading) {
    ['incentiveDailyRows', 'incentiveMonthlyRows', 'incentiveQuarterRows'].forEach(function(id) {
      setHtml(id, '<tr><td colspan="7" class="text-muted">' + (loading ? '<span class="widget-loading">' : '<span>') + escapeHtml(message) + '</span></td></tr>');
    });
    ['incentiveDailyTotal', 'incentiveMonthlyTotal', 'incentiveMonthTotal', 'incentiveQuarterTotal'].forEach(function(id) { incentiveText(id, loading ? 'Sedang memuat data' : '—'); });
    ['incentiveGate', 'incentivePeriod', 'incentiveQuarterStatus', 'incentiveWarnings', 'incentiveCombined', 'incentivePolicy', 'incentiveDailyPolicy'].forEach(function(id) { incentiveText(id, ''); });
  }
  function openIncentives() {
    var state = incentiveState(), seq = ++state.setupSeq;
    ++state.seq; state.report = null; state.setup = null;
    incentiveStatus('Sedang memuat data', true);
    document.getElementById('incentiveSales').disabled = true;
    kchRun().withSuccessHandler(function(res) {
      if (seq !== incentiveState().setupSeq) return;
      if (!res || !res.success || !Array.isArray(res.sales) || typeof res.today !== 'string' || !/^20\d{2}-(0[1-9]|1[0-2])-\d{2}$/.test(res.today)) { incentiveStatus('Daftar sales belum dapat dimuat. Tekan Muat ulang.'); return; }
      state.setup = res;
      var select = document.getElementById('incentiveSales'), previous = select.value;
      select.innerHTML = res.sales.map(function(s) { return '<option value="' + escapeHtml(s.salesId) + '">' + escapeHtml(s.name + ' · ' + s.team + (s.active ? '' : ' (nonaktif)')) + '</option>'; }).join('');
      select.disabled = !res.sales.length;
      if (res.sales.some(function(s) { return s.salesId === previous; })) select.value = previous;
      var month = document.getElementById('incentiveMonth'); if (!month.value) month.value = res.today.slice(0, 7);
      if (!res.sales.length) { incentiveStatus('Belum ada profil tim yang memiliki juklak insentif.'); return; }
      loadIncentiveReport();
    }).withFailureHandler(function(err) {
      if (seq !== incentiveState().setupSeq) return;
      incentiveStatus(err.message || 'Gagal memuat daftar sales. Tekan Muat ulang.');
    }).getIncentiveSetup();
  }
  function loadIncentiveReport() {
    var state = incentiveState(), seq = ++state.seq;
    var month = document.getElementById('incentiveMonth').value, sales = document.getElementById('incentiveSales').value;
    state.report = null; incentiveStatus('Sedang memuat data', true);
    if (!state.setup) { incentiveStatus('Daftar sales belum siap. Tekan Muat ulang.'); return; }
    if (!/^20\d{2}-(0[1-9]|1[0-2])$/.test(month || '') || !sales) { incentiveStatus('Pilih sales dan bulan yang valid.'); return; }
    kchRun().withSuccessHandler(function(res) {
      if (seq !== incentiveState().seq) return;
      try {
        if (!res || !res.success || !res.monthly || !res.quarter || !Array.isArray(res.daily) || !Array.isArray(res.monthly.parameters) || !Array.isArray(res.quarter.months)) throw new Error('Respons Insentif tidak lengkap. Tekan Muat ulang.');
        renderIncentiveReport(res); state.report = res;
      } catch (err) { incentiveStatus(err.message || 'Gagal menampilkan Insentif.'); }
    }).withFailureHandler(function(err) {
      if (seq !== incentiveState().seq) return;
      incentiveStatus(err.message || 'Gagal memuat Insentif. Tekan Muat ulang.');
    }).getIncentiveReport(month, sales);
  }
  function incentivePercent(value) { if(value===null||value===undefined)return '—';return (value * 100).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + '%'; }
  function renderIncentiveReport(res) {
    var q = res.quarter, m = res.monthly;
    incentiveText('incentiveDailyTotal', res.dailyTotal == null ? 'Belum dapat dihitung' : formatRupiah(res.dailyTotal));
    incentiveText('incentiveMonthlyTotal', formatRupiah(m.total));
    incentiveText('incentiveMonthTotal', res.monthTotal == null ? 'Belum dapat dihitung' : formatRupiah(res.monthTotal));
    incentiveText('incentiveQuarterTotal',q.masterVerified===false?'Belum terverifikasi':formatRupiah(q.amount));
    incentiveText('incentivePolicy', res.isJunior ? 'Tidak memiliki target sendiri. Mengikuti 70% hasil Senior ' + res.referenceSales.name + ' · ' + res.referenceSales.team + ', termasuk triwulan. Angka penjualan harian/triwulan di tabel adalah acuan Senior.' : res.policy === 'LOADING' ? 'MPR/Canvasser: hanya produk loading yang masuk target dan insentif. Target Fokus A Rp6,4 juta, Fokus B Rp8,2 juta, TV loading Rp80 juta, AA 400, Branding 300. TV, Fokus A dan Fokus B masing-masing harus ≥70% untuk pembayaran penuh.' : 'Motoris/MMTW: seluruh produk kecuali Promag Tablet. Target Fokus A Rp5 juta, Fokus B Rp5 juta, TV Rp27 juta dan AA 400. Pembayaran penuh jika TV ≥70%.');
    incentiveText('incentiveDailyPolicy', res.policy === 'LOADING' ? 'Rp70.000 satu kali per HK jika produk loading ≥Rp2,5 juta + Promag Tablet ≥Rp1 juta, ATAU produk loading ≥Rp3,5 juta. Produk lain tetap tercatat sebagai penjualan, tetapi tidak mengejar target insentif. ' + (res.isJunior ? 'Tarif/alokasi yang ditampilkan untuk Junior adalah 70% tarif Senior.' : 'Tarif kemudian mengikuti faktor pencapaian bulanan.') : 'Satu tarif per HK: <Rp800 ribu = Rp0; Rp800 ribu–<Rp1 juta = Rp10 ribu; Rp1 juta–<Rp1,2 juta = Rp20 ribu; Rp1,2 juta–Rp1,5 juta = Rp30 ribu; >Rp1,5 juta = Rp50 ribu. Tanpa plafon tetap 25 HK.');
    incentiveText('incentiveCombined', res.isJunior ? 'Alokasi 70% × hasil diterima Senior ' + res.referenceSales.name + ' (' + (res.referenceMonthTotal == null ? 'belum dapat dihitung' : formatRupiah(res.referenceMonthTotal)) + ') = ' + (res.monthTotal == null ? 'belum dapat dihitung' : formatRupiah(res.monthTotal)) + '. Rincian Junior diterima: harian ' + (res.dailyTotal == null ? 'belum dapat dihitung' : formatRupiah(res.dailyTotal)) + ' dan bulanan ' + formatRupiah(m.total) + '. Tidak ada potongan ulang.' : res.monthSubtotal == null ? 'Total gabungan belum dapat dihitung karena kalender harian belum tersedia.' : 'Sebelum penyesuaian: harian ' + formatRupiah(res.dailyScheduledTotal) + ' + bulanan ' + formatRupiah(m.scheduledTotal) + ' = ' + formatRupiah(res.monthSubtotal) + '. Total diterima: ' + formatRupiah(res.monthSubtotal) + ' × ' + (m.eligible ? '100%' : '50%') + ' = ' + formatRupiah(res.monthTotal) + '. Rincian diterima: harian ' + formatRupiah(res.dailyTotal) + ' dan bulanan ' + formatRupiah(m.total) + '.');
    incentiveText('incentivePeriod', res.month + ' · ' + (res.monthlyClosed ? 'Periode bulanan selesai' : 'Estimasi bulan berjalan/belum selesai') + ' · ' + res.paidDays + ' hari mendapat insentif dari ' + res.workDays + ' HK · Data sampai ' + res.today);
    var checks = res.isJunior ? res.referenceGateChecks || [] : m.gateChecks || [{name:'Total Value',actual:m.actualValue,minimum:m.minimumValue,reached:m.eligible}];
    incentiveText('incentiveGate', (res.isJunior ? 'Acuan Senior ' + res.referenceSales.name + ': ' : '') + checks.map(function(g) { return g.name + ' ' + formatRupiah(g.actual) + ' / minimal ' + formatRupiah(g.minimum) + ' (70%): ' + (g.reached ? 'memenuhi' : 'belum memenuhi'); }).join('; ') + '. Total gabungan harian + bulanan ' + (res.isJunior ? 'Senior ' : '') + 'dibayar ' + (m.eligible ? '100%' : '50%') + '. Bonus triwulan tidak dipotong. ' + (res.isJunior ? 'Junior menerima 70% hasil Senior tersebut.' : 'AA: ' + m.aaTotal.toLocaleString('id-ID') + ' outlet · ' + m.aaEnteredDays + ' hari sudah diinput.' + (res.policy==='LOADING' ? ' Branding: '+m.brandingTotal.toLocaleString('id-ID')+' outlet · '+m.brandingEnteredDays+' hari diinput.' : '')));
    var qr = res.isJunior ? res.referenceQuarter : q;
    incentiveText('incentiveQuarterStatus', 'TW' + q.number + ' ' + q.year + ' · ' + (q.closed ? 'Periode triwulan selesai' : 'Estimasi triwulan belum selesai') + ' · ' + qr.reachedMonths + ' dari 3 bulan mencapai target ≥100% · Akumulasi ' + (res.isJunior ? 'Senior ' : '') + formatRupiah(qr.actual) + ' / ' + formatRupiah(qr.target) + ' (' + incentivePercent(qr.achievement) + ') · Tingkat ' + (q.tier ? q.tier + '%' : 'belum mencapai 100%') + (res.isJunior ? ' · Junior: 70% × bonus Senior '+formatRupiah(qr.amount)+' = '+formatRupiah(q.amount) : ''));
    incentiveText('incentiveWarnings', (res.warnings || []).join(' '));
    setHtml('incentiveMonthlyRows', m.parameters.map(function(p, index) {
      var actual = p.actual == null ? '—' : index < 3 ? formatRupiah(p.actual) : p.actual.toLocaleString('id-ID') + ' outlet';
      var target = p.target == null ? '—' : index < 3 ? formatRupiah(p.target) : p.target.toLocaleString('id-ID') + ' outlet';
      return '<tr><td>' + escapeHtml(p.name) + '</td><td>' + actual + '</td><td>' + target + '</td><td>' + (p.achievement == null ? '—' : incentivePercent(p.achievement)) + '</td><td>' + (p.tier == null ? '—' : p.tier ? p.tier + '%' : '<90%') + '</td><td>' + formatRupiah(p.scheduled) + '</td><td>' + formatRupiah(p.amount) + '</td></tr>';
    }).join(''));
    setHtml('incentiveQuarterRows', q.months.map(function(row) {
      if (res.isJunior) row = {month:row.month,actual:row.reference.actual,target:row.reference.target,achievement:row.reference.achievement,reached:row.reached};
      return '<tr><td>' + escapeHtml(row.month) + '</td><td>' + formatRupiah(row.actual) + '</td><td>' + formatRupiah(row.target) + '</td><td>' + incentivePercent(row.achievement) + '</td><td>' + (row.masterVerified===false?'Master belum diverifikasi':row.reached ? 'Target tercapai ≥100%' : 'Belum mencapai 100%') + '</td></tr>';
    }).join(''));
    setHtml('incentiveDailyRows', res.daily.map(function(row) {
      return '<tr><td>' + escapeHtml(row.date) + '</td><td>' + escapeHtml(row.status) + '</td><td>' + formatRupiah(res.isJunior ? row.referenceValue : row.value) + '</td><td>' + formatRupiah(res.isJunior ? row.referenceTabletValue : row.tabletValue || 0) + '</td><td>' + (row.scheduled == null || res.dailyTotal == null ? '—' : formatRupiah(row.scheduled)) + '</td><td>' + (row.amount == null || res.dailyTotal == null ? '—' : formatRupiah(row.amount)) + '</td></tr>';
    }).join(''));
  }
</script>
