<script>
  var archiveTableLabels={SALES_TRANSACTIONS:'Penjualan',ATTENDANCE:'Absensi',VISIT_PHOTOS:'Foto kunjungan',INVENTORY_MOVEMENTS:'Mutasi gudang',SALES_STOCK_MOVEMENTS:'Mutasi pegangan sales',STOCK_PICKUPS:'Pengambilan barang',SALES_CASH_DEPOSITS:'Setoran uang',SKOR_EVENTS:'Input AA / branding',TODAY_PLAN:'Rencana kunjungan',WEEKLY_MEETINGS:'Meeting mingguan',MONTHLY_TEAM_REPORT:'Laporan bulanan tim',ACTIVITY_LOGS:'Log aktivitas',INSENTIF_HARIAN:'Insentif harian',INSENTIF_BULANAN:'Insentif bulanan',INSENTIF_TRIWULAN:'Insentif triwulan'};
  function openMonthlyArchives(){
    var generation=typeof kchAuthGeneration==='number'?kchAuthGeneration:0;
    var state={page:1,generation:generation,version:0};appState.archive=state;
    setText('archiveStatus','Memuat arsip…');setHtml('archiveTableBody','');setHtml('archiveTableHead','');setHtml('archiveSnapshot','');
    setHtml('archiveMonth','<option value="">Pilih bulan</option>');setHtml('archiveTable','<option value="">Pilih data</option>');
    kchRun().withSuccessHandler(function(result){
      if(appState.archive!==state||appState.archive.generation!==generation||generation!==kchAuthGeneration)return;
      if(!result.success){setText('archiveStatus',result.message||'Arsip belum berhasil dimuat.');return;}
      appState.archive.months=result.months;appState.archive.canOpenSnapshot=result.canOpenSnapshot===true;
      setHtml('archiveMonth','<option value="">Pilih bulan</option>'+result.months.map(function(row){return '<option value="'+escapeHtml(row.month)+'">'+escapeHtml(row.month)+'</option>';}).join(''));
      setHtml('archiveTable',result.tables.map(function(name){return '<option value="'+escapeHtml(name)+'">'+escapeHtml(archiveTableLabels[name]||name)+'</option>';}).join(''));
      setText('archiveStatus',result.months.length?'Pilih bulan untuk melihat data arsip. Arsip hanya dapat dilihat.':'Belum ada bulan yang diarsipkan.');
      if(result.months.length){document.getElementById('archiveMonth').value=result.months[0].month;loadMonthlyArchiveTable(1);}
    }).withFailureHandler(function(err){if(appState.archive===state&&generation===kchAuthGeneration)setText('archiveStatus',err.message||'Gagal memuat arsip.');}).getMonthlyArchives();
  }
  function loadMonthlyArchiveTable(page){
    var state=appState.archive;if(!state)return;
    var month=getValue('archiveMonth'),name=getValue('archiveTable');if(!month||!name)return;
    var generation=state.generation,version=++state.version;
    state.page=page||1;
    document.getElementById('archivePrev').disabled=true;document.getElementById('archiveNext').disabled=true;
    setText('archiveStatus','Memuat data arsip…');setHtml('archiveTableHead','');setHtml('archiveTableBody','');
    var entry=(state.months||[]).find(function(row){return row.month===month;});setHtml('archiveSnapshot','');
    if(appState.user&&appState.user.role==='ADMIN'&&state.canOpenSnapshot&&entry&&entry.snapshotUrl){var link=document.createElement('a');link.textContent='Buka salinan spreadsheet lengkap';link.href=entry.snapshotUrl;link.target='_blank';link.rel='noopener noreferrer';document.getElementById('archiveSnapshot').appendChild(link);}
    kchRun().withSuccessHandler(function(result){
      if(!appState.archive||appState.archive!==state||generation!==kchAuthGeneration||version!==state.version)return;
      setHtml('archiveTableHead','<tr>'+result.headers.map(function(h){return '<th>'+escapeHtml(h)+'</th>';}).join('')+'</tr>');
      setHtml('archiveTableBody',result.rows.map(function(row){return '<tr>'+row.map(function(value,column){if(result.headers[column]==='photo_url'&&value&&['STOCK_PICKUPS','SALES_CASH_DEPOSITS'].indexOf(name)>=0){var idIndex=result.headers.indexOf(name==='STOCK_PICKUPS'?'pickup_id':'deposit_id');return '<td><button type="button" class="btn btn-outline btn-sm" onclick="openPickupProof(\''+escapeHtml(jsQuote(row[idIndex]))+'\',\''+(name==='SALES_CASH_DEPOSITS'?'DEPOSIT':'PICKUP')+'\')">Lihat foto</button></td>';}return '<td style="max-width:360px;white-space:pre-wrap;overflow-wrap:anywhere">'+escapeHtml(String(value==null?'':value))+'</td>';}).join('')+'</tr>';}).join('')||'<tr><td>Belum ada data untuk bagian ini.</td></tr>');
      state.total=result.total;setText('archiveStatus',month+' · '+result.total+' baris · Halaman '+result.page+' dari '+Math.max(1,Math.ceil(result.total/100))+' · Arsip hanya dapat dilihat');
      document.getElementById('archivePrev').disabled=result.page<=1;document.getElementById('archiveNext').disabled=result.page*100>=result.total;
    }).withFailureHandler(function(err){if(appState.archive===state&&version===state.version&&generation===kchAuthGeneration)setText('archiveStatus',err.message||'Gagal membaca arsip.');}).getMonthlyArchiveTable(month,name,state.page);
  }
</script>
