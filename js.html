<script>
  /**

  var appState = {
    score: null,
    incentive: null,
    currentView: 'dashboard',
    dashboardPeriod: 'TODAY',
    customStartDate: '',
    customEndDate: '',
    dashboardTeamFilter: 'ALL',
    attendanceDate: '',
    attendanceTeamFilter: 'ALL',
    attendanceData: [],
    attendanceSales: [],
    visitPhotoDate: '',

    teams: [],
    distributors: [],
    products: [],
    sales: [],
    priceMaster: [],
    inventory: [],
    files: [],
    visitPhotos: [],
    todayPlans: [],
    weeklyMeetings: [],
    kchNews: [],
    canManageKchNews: false,
    canManageTodayPlan: false,
    canManageWeeklyMeetings: false,
    workDays: null,
    dashboardData: null,
    salesFilterTeam: 'ALL',
    charts: {},
    transactionPage: 1,

    selectedSales: null,

  function updateDynamicGreeting() {
    var now = new Date();
    var hour = now.getHours();
    var greeting = 'Good Morning';
    if (hour >= 12 && hour < 18) greeting = 'Good Afternoon';
    if (hour >= 18) greeting = 'Good Evening';

    var shortName = (appState.user && appState.user.shortName) ? appState.user.shortName : 'Ryan';
    var fullName = (appState.user && appState.user.fullName) ? appState.user.fullName : 'Ryan Pratama';

    var greetingEl = document.getElementById('headerGreetingText');
    if (greetingEl) greetingEl.innerHTML = greeting + ', ' + escapeHtml(shortName) + ' <span class="wave-emoji">👋</span>';

    var subtitleEl = document.getElementById('headerSubtitleText');
    if (subtitleEl && appState.currentView === 'dashboard') {
      subtitleEl.textContent = 'Dashboard Sales Monitoring';
    }

    var userNameEl = document.querySelector('.user-name-header');
    if (userNameEl) userNameEl.textContent = fullName;

    var menuNameEl = document.querySelector('.user-menu-name');
    if (menuNameEl) menuNameEl.textContent = fullName;

    var menuEmailEl = document.querySelector('.user-menu-email');
    if (menuEmailEl && appState.user && appState.user.email) menuEmailEl.textContent = appState.user.email;

    var avatarEl = document.querySelector('.user-avatar-circle');
    if (avatarEl) avatarEl.textContent = String(shortName || 'R').charAt(0).toUpperCase();
  }

  function getSalesDailyTargetRate(teamName) {
    if (!teamName) return 0;
    var t = String(teamName).toUpperCase().trim();
    if (t === 'SPR') return 0;
    if (t.indexOf('JUNIOR') > -1) return 0;
    if (t.indexOf('ASISTEN MPR') > -1) return 0;
    if (t === 'MPR' || t.indexOf('MPR ') === 0 || t.indexOf(' MPR') > -1) return 3500000;
    if (t.indexOf('ULTIMATE') > -1) return 800000;
    if (t.indexOf('MMTW') > -1) return 1200000;
    if (t.indexOf('MOTORIS') > -1) return 1200000;
    if (t.indexOf('SPG') > -1) return 800000;
    if (t.indexOf('CANVASSER') > -1) return 3500000;
    return 0;
  }

  function getSalesMonthlyTarget(teamName, manualTarget) {
    var n = parseCleanNumber(manualTarget);
    if (!teamName) return (n > 0) ? n : 0;
    var t = String(teamName).toUpperCase().trim();
    if (t === 'SPR') return 0;
    if (t.indexOf('JUNIOR') > -1) return 0;
    if (t.indexOf('ASISTEN MPR') > -1) return 0;
    if (t === 'MPR' || t.indexOf('MPR ') === 0 || t.indexOf(' MPR') > -1) {
      return (n > 0 && n !== 30000000 && n !== 27000000) ? n : 80000000;
    }
    if (t.indexOf('CANVASSER') > -1) {
      return (n > 0 && n !== 30000000 && n !== 27000000) ? n : 80000000;
    }
    if (t.indexOf('ULTIMATE') > -1) return (n > 0) ? n : 20000000;
    if (t.indexOf('MMTW') > -1) return (n > 0 && n !== 30000000) ? n : 27000000;
    if (t.indexOf('MOTORIS') > -1) return (n > 0 && n !== 30000000) ? n : 27000000;
    if (t.indexOf('SPG') > -1) return (n > 0) ? n : 20000000;
    if (n > 0) return n;
    return 0;
  }

  function formatRupiah(value) {
    var n = parseCleanNumber(value);
    return 'Rp ' + n.toLocaleString('id-ID', { maximumFractionDigits: 2 });
  }

  function parseCleanNumber(val) {
    if (val === null || val === undefined || val === '') return 0;
    if (typeof val === 'number') return isNaN(val) ? 0 : val;
    var clean = String(val).replace(/Rp|\s/gi, '').trim();
    if (!clean) return 0;
    if (clean.indexOf('.') > -1 && clean.indexOf(',') > -1) {
      clean = clean.replace(/\./g, '').replace(',', '.');
    } else if (clean.indexOf('.') > -1 && clean.indexOf(',') === -1) {
      var parts = clean.split('.');
      if (parts.length > 2 || (parts.length === 2 && parts[1].length === 3)) {
        clean = clean.replace(/\./g, '');
      }
    } else if (clean.indexOf(',') > -1) {
      clean = clean.replace(',', '.');
    }
    var n = parseFloat(clean);
    return isNaN(n) ? 0 : n;
  }

  function normalizeKey(str) {
    if (str === null || str === undefined) return '';
    return String(str).trim().toUpperCase();
  }

  function isTeamMatched(teamValue, targetTeam) {
    if (!targetTeam || targetTeam === 'ALL') return true;
    return normalizeKey(teamValue) === normalizeKey(targetTeam);
  }

  function isNonTargetTeam(teamName) {
    var t = normalizeKey(teamName);
    return t === 'JUNIOR CANVASSER' || t === 'ASISTEN MPR' || t === 'SPR';
  }

  function getKpiTeamGroup(teamName) {
    var t = normalizeKey(teamName);
    if (t === 'Canvasser' || t === 'MPR') return 'CANVASSER GROUP';
    if (t === 'MOTORIS' || t === 'MMTW') return 'MOTORIS GROUP';
    if (t === 'MOTORIS ULTIMATE') return 'MOTORIS ULTIMATE';
    if (t === 'SPG KELONTONG') return 'SPG KELONTONG';
    return 'NON-TARGET';
  }

  function getTeamBadgeClass(teamName) {
    var t = String(teamName || '').toLowerCase();
    if (t.indexOf('asisten mpr') > -1 || t.indexOf('junior') > -1) return 'badge-team-junior';
    if (t.indexOf('mpr') > -1 || t.indexOf('canvasser') > -1) return 'badge-team-senior';
    if (t.indexOf('ultimate') > -1) return 'badge-team-ultimate';
    if (t.indexOf('mmtw') > -1 || t.indexOf('motoris') > -1) return 'badge-team-motoris';
    if (t.indexOf('spg') > -1) return 'badge-team-spg';
    return 'badge-neutral';
  }

  function formatDateIndo(dateVal) {
    if (!dateVal) return '-';
    var str = String(dateVal).trim();
    var ymd = normalizeDateString(dateVal);
    if (ymd && /^\d{4}-\d{2}-\d{2}$/.test(ymd)) {
      var p = ymd.split('-');
      return p[2] + '/' + p[1] + '/' + p[0];
    }
    return str;
  }

  function normalizeDateString(dateVal) {
    if (!dateVal) return '';
    var str = String(dateVal).trim();
    if (str.indexOf(' ') > -1) str = str.split(' ')[0];
    if (str.indexOf('/') > -1) {
      var parts = str.split('/');
      if (parts.length === 3) {
        if (parts[0].length === 4) return parts[0] + '-' + ('0' + parts[1]).slice(-2) + '-' + ('0' + parts[2]).slice(-2);
        var d = ('0' + parts[0]).slice(-2);
        var m = ('0' + parts[1]).slice(-2);
        var y = parts[2].length === 2 ? '20' + parts[2] : parts[2];
        return y + '-' + m + '-' + d;
      }
    }
    if (str.indexOf('-') > -1) {
      var dash = str.split('-');
      if (dash.length === 3 && dash[0].length <= 2) {
        var dd = ('0' + dash[0]).slice(-2);
        var mm = ('0' + dash[1]).slice(-2);
        var yy = dash[2].length === 2 ? '20' + dash[2] : dash[2];
        return yy + '-' + mm + '-' + dd;
      }
    }
    return str.slice(0, 10);
  }

  function showToast(message, type) {
    var box = document.getElementById('toastBox');
    if (!box) return;
    var toast = document.createElement('div');
    toast.className = 'toast ' + (type === 'error' ? 'toast-error' : type === 'info' ? 'toast-info' : 'toast-success');
    var icon = type === 'error' ? 'fa-circle-exclamation' : type === 'info' ? 'fa-circle-info' : 'fa-circle-check';
    toast.innerHTML = '<i class="fa-solid ' + icon + '"></i><span>' + escapeHtml(message) + '</span>';
    box.appendChild(toast);
    setTimeout(function() {
      toast.style.opacity = '0';
      toast.style.transform = 'translateY(8px)';
      setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 220);
    }, 3500);
  }

  function escapeHtml(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function toggleSidebarMobile() {
    var sidebar = document.getElementById('sidebar');
    if (sidebar) sidebar.classList.toggle('show');
  }

  function toggleSidebarDesktop() {
    var layout = document.querySelector('.app-layout');
    var button = document.getElementById('desktopSidebarToggle');
    var icon = document.getElementById('desktopSidebarToggleIcon');
    if (!layout || !button) return;

    var isCollapsed = layout.classList.toggle('sidebar-collapsed');
    button.setAttribute('aria-expanded', isCollapsed ? 'false' : 'true');
    button.setAttribute('aria-label', isCollapsed ? 'Buka sidebar' : 'Tutup sidebar');
    button.title = isCollapsed ? 'Buka sidebar' : 'Tutup sidebar';
    if (icon) icon.className = isCollapsed ? 'fa-solid fa-arrow-right' : 'fa-solid fa-arrow-left';
  }

  function toggleUserDropdown(event) {
    if (event) event.stopPropagation();
    var menu = document.getElementById('userDropdownMenu');
    if (!menu) return;
    var isVisible = menu.style.display !== 'none';
    menu.style.display = isVisible ? 'none' : 'block';
  }

  function toggleCustomPeriodDropdown() {
    var dropdown = document.getElementById('customPeriodDropdown');
    if (!dropdown) return;
    var isVisible = dropdown.style.display !== 'none';
    dropdown.style.display = isVisible ? 'none' : 'block';
  }

  function switchView(viewName) {
    if (appState.user && appState.user.role === 'GUEST' && viewName === 'input-tx') { showToast('Akun Tamu hanya boleh melihat data.', 'error'); return; }
    appState.currentView = viewName;

    document.querySelectorAll('.content-view').forEach(function(el) {
      el.classList.remove('active');
    });
    var view = document.getElementById('view-' + viewName);
    if (view) view.classList.add('active');

    document.querySelectorAll('.nav-item').forEach(function(el) {
      el.classList.remove('active');
    });
    var nav = document.getElementById('nav-' + viewName);
    if (nav) nav.classList.add('active');

    var subtitle = document.getElementById('headerSubtitleText');
    if (subtitle) {
      var subtitles = {
        dashboard: 'Dashboard Sales Monitoring',
        'input-tx': 'Pencatatan Penjualan Faktur',
        riwayat: 'Riwayat Transaksi Penjualan',
        'laporan-bulanan': 'Laporan Bulanan Tim',
        skor: 'Skor Motoris/MMTW dan MPR/Canvasser',
        insentif: 'Insentif Tim Sales',
        absensi: 'Absensi Tim',
        'foto-kunjungan': 'Dokumentasi Foto Kunjungan',
        'today-plan': 'Agenda Kunjungan Tim Hari Ini',
        'weekly-meeting': 'Hasil Meeting Mingguan',
        'kch-news': 'Berita dan Informasi Kalbe',
        stok: 'Monitoring Stok Gudang',
        pengambilan: 'Pengambilan Barang & Pegangan Sales',
        harga: 'Master Harga Produk',
        tim: 'Direktori Profil Sales',
        dokumen: 'Arsip & Folder Google Drive'
      };
      subtitle.textContent = subtitles[viewName] || 'Dashboard Sales Monitoring';
    }

    var sidebar = document.getElementById('sidebar');
    if (sidebar) sidebar.classList.remove('show');

    var userMenu = document.getElementById('userDropdownMenu');
    if (userMenu) userMenu.style.display = 'none';

    if (viewName === 'skor') openScore();
    if (viewName === 'insentif') openIncentives();
    if (viewName === 'input-tx') {
      setDefaultTransactionDate();
      ensureTransactionRows();
    }
    if (viewName === 'riwayat') loadTransactions(1);
    if (viewName === 'laporan-bulanan') {
      populateMonthlyReportSales();
      loadMonthlyTeamReport();
    }
    if (viewName === 'pengambilan') loadStockPickupData();
    if (viewName === 'stok') renderInventoryTable();
    if (viewName === 'harga') renderPriceMasterTable();
    if (viewName === 'tim') renderSalesProfiles();
    if (viewName === 'dokumen') renderDriveFiles();
    if (viewName === 'foto-kunjungan') renderVisitPhotos();
    if (viewName === 'today-plan') {
      populateTodayPlanSales();
      resetTodayPlanDate();
      loadTodayPlans(getLocalDateInputValue());
    }
    if (viewName === 'weekly-meeting') {
      if (!getValue('weeklyMeetingDate')) setValue('weeklyMeetingDate', getLocalDateInputValue());
      loadWeeklyMeetings();
    }
    if (viewName === 'kch-news') loadKchNews();
  }

  document.addEventListener('DOMContentLoaded', function() {
    document.addEventListener('click', function(event) {
      var userWrapper = document.querySelector('.user-profile-wrapper');
      var userMenu = document.getElementById('userDropdownMenu');
      if (userWrapper && userMenu && !userWrapper.contains(event.target)) userMenu.style.display = 'none';

      var periodWrap = document.querySelector('.date-badge-wrapper');
      var periodDropdown = document.getElementById('customPeriodDropdown');
      if (periodWrap && periodDropdown && !periodWrap.contains(event.target)) periodDropdown.style.display = 'none';
    });

    initKchAuthentication();
  });

  function initApp() {
    updateDynamicGreeting();
    setDefaultTransactionDate();
    setupAttendanceDateControls();
    setupVisitPhotoDateControls();
    renderVisitPhotos();
    restorePendingSalesTransaction();
    loadMetadata();
  }

  function triggerManualSync() {
    showToast('Sinkronisasi data dimulai...', 'info');
    var menu = document.getElementById('userDropdownMenu');
    if (menu) menu.style.display = 'none';
    loadMetadata(function() {
      if (appState.currentView === 'riwayat') loadTransactions(appState.transactionPage || 1);
    });
  }

  function setMetadataWidgetState(state) {
    var text = state === 'loading' ? 'Sedang memuat data' : 'Gagal memuat data';
    [['inventoryTbody', 9], ['masterPriceTbody', 8]].forEach(function(item) {
      setHtml(item[0], '<tr><td colspan="' + item[1] + '" class="text-center text-muted py-3"><span class="widget-loading">' + text + '</span></td></tr>');
    });
    ['salesProfilesGridContainer', 'driveFilesGridContainer', 'kchNewsPageList'].forEach(function(id) {
      setHtml(id, '<div class="attendance-loading-placeholder"><span class="widget-loading">' + text + '</span></div>');
    });
    ['salesTotalCountBadge', 'filesTotalCountBadge', 'kchNewsDashboardHeadline', 'kchNewsDashboardSummary'].forEach(function(id) { setText(id, text); });
  }

  function loadMetadata(callback) {
    if (appState.isLoadingMetadata) return;
    appState.isLoadingMetadata = true;
    setMetadataWidgetState('loading');
    // Invalidate older metrics while fresh metadata is being read.
    appState.dashboardRequestSeq++;
    appState.isLoadingDashboard = false;
    setDashboardLoadState('loading');
    kchRun()
      .withSuccessHandler(function(res) {
        appState.isLoadingMetadata = false;
        if (!res || !res.success) {
          showToast(res && res.message ? res.message : 'Gagal memuat metadata aplikasi.', 'error');
          setDashboardLoadState('error');
          setMetadataWidgetState('error');
          showKchAuthError(res && res.message || 'Gagal memuat data aplikasi.');
          return;
        }

        appState.user = res.user || appState.user;
        appState.teams = res.teams || [];
        appState.distributors = res.distributors || [];
        appState.products = res.products || [];
        appState.sales = res.sales || [];
        appState.attendanceSales = res.attendanceSales || res.sales || [];
        appState.priceMaster = res.priceMaster || [];
        appState.inventory = res.inventory || [];
        appState.files = res.files || [];
        appState.visitPhotos = res.visitPhotos || [];
        appState.kchNews = res.kchNews || [];
        appState.weeklyMeetings = res.weeklyMeetings || [];
        appState.canManageKchNews = !!res.canManageKchNews;
        appState.canManageTodayPlan = !!res.canManageTodayPlan;
        appState.canManageWeeklyMeetings = !!res.canManageWeeklyMeetings;
        appState.workDays = res.workDays || null;

        updateDynamicGreeting();
        if (res.sidebarLogoUrl) {
          var logo = document.querySelector('.brand-logo-icon');
          if (logo) { var img = document.createElement('img'); img.src = res.sidebarLogoUrl; img.alt = 'Logo'; img.style.cssText = 'width:24px;height:28px;object-fit:contain'; logo.replaceChildren(img); }
        }
        populateAllSelects();
        renderInventoryTable();
        renderPriceMasterTable();
        renderSalesProfiles();
        renderDriveFiles();
        renderVisitPhotos();
        renderKchNews(appState.kchNews);
        renderTodayPlans(appState.todayPlans || []);
        renderWeeklyMeetings(appState.weeklyMeetings || []);
        loadTodayPlans(getLocalDateInputValue());
        ensureTransactionRows();
        if (typeof loadStockPickupData === 'function') loadStockPickupData();
        if (appState.pendingTransaction) txClientLock(true);
        if (appState.transactionEdit) updateEditTransactionTotals();
        loadDashboardMetrics();
        if (typeof callback === 'function') callback();
      })
      .withFailureHandler(function(err) {
        appState.isLoadingMetadata = false;
        setDashboardLoadState('error');
        setMetadataWidgetState('error');
        showToast('Gagal terhubung ke server: ' + (err && err.message ? err.message : 'Unknown error'), 'error');
      })
      .getInitialAppMetadata();
  }

  function populateAllSelects() {
    populateSelectOptions('inputTxTeam', appState.teams, '-- Pilih Tim --', false);
    populateSelectOptions('txFilterTeam', appState.teams, 'Semua Tim', true);
    populateSelectOptions('filterPriceTeam', appState.teams, 'Semua Tim', true);
    populateSelectOptions('profileFilterTeam', appState.teams, 'Semua Tim', true);
    populateFileCategories();
    populateMonthlyReportSales();
    populateTodayPlanSales();
  }

  function populateMonthlyReportSales() {
    var select = document.getElementById('monthlyReportSales');
    if (!select) return;
    var current = select.value;
    var html = '<option value="">Pilih Sales</option>';
    var availableSales = (appState.sales || []).filter(function(sales) {
      return normalizeKey(sales.status || 'ACTIVE') !== 'INACTIVE' && sales.sales_id;
    });
    availableSales.forEach(function(sales) {
      var label = (sales.full_name || sales.sales_id) + ' (' + (sales.team_name || '-') + ')';
      html += '<option value="' + escapeHtml(sales.sales_id) + '">' + escapeHtml(label) + '</option>';
    });
    select.innerHTML = html;
    if (current && Array.prototype.some.call(select.options, function(option) { return option.value === current; })) {
      select.value = current;
    } else if (availableSales.length) {
      select.value = availableSales[0].sales_id;
    }

    var monthInput = document.getElementById('monthlyReportMonth');
    if (monthInput && !monthInput.value) monthInput.value = getLocalDateInputValue().slice(0, 7);
  }

  function loadMonthlyTeamReport() {
    populateMonthlyReportSales();
    var salesId = getValue('monthlyReportSales');
    var month = getValue('monthlyReportMonth');
    if (!salesId || !month) return;

    setText('monthlyReportTotalSales', 'Sedang memuat data');
    setText('monthlyReportTotalShj', 'Sedang memuat data');
    setText('monthlyReportTotalHK', 'Sedang memuat data');
    var tbody = document.getElementById('monthlyReportProductsTbody');
    if (tbody) tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3"><span class="widget-loading">Sedang memuat data</span></td></tr>';

    kchRun()
      .withSuccessHandler(function(res) {
        if (!res || !res.success) {
          showToast(res && res.message ? res.message : 'Laporan bulanan gagal dimuat.', 'error');
        ['monthlyReportTotalSales', 'monthlyReportTotalShj', 'monthlyReportTotalHK'].forEach(function(id) { setText(id, '—'); });
          if (tbody) tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">Laporan tidak dapat dimuat.</td></tr>';
          return;
        }
        var summary = res.summary || {};
        var sales = res.sales || {};
        setText('monthlyReportTotalSales', formatRupiah(summary.totalSales));
        setText('monthlyReportTotalShj', formatRupiah(summary.totalShj));
        setText('monthlyReportTotalHK', (Number(summary.totalHK) || 0) + ' Hari');
        var targetText = sales.targetMonthly > 0
          ? 'Target bulanan: ' + formatRupiah(sales.targetMonthly) + ' · ' + (Number(sales.achievementPercent) || 0).toFixed(1).replace('.', ',') + '%'
          : 'Target bulanan tidak tersedia';
        setText('monthlyReportTargetInfo', targetText);
        setText('monthlyReportProductSubtitle', (sales.salesName || salesId) + ' · ' + (sales.teamName || '-') + ' · Peringkat berdasarkan jumlah produk terjual');

        var products = res.products || [];
        if (!tbody) return;
        if (!products.length) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">Belum ada penjualan produk untuk sales ini pada bulan yang dipilih.</td></tr>';
          return;
        }
        tbody.innerHTML = products.map(function(product, index) {
          return '<tr>' +
            '<td class="text-center"><span class="badge badge-neutral">' + (index + 1) + '</span></td>' +
            '<td>' + escapeHtml(product.productId || '-') + '</td>' +
            '<td class="font-semibold">' + escapeHtml(product.productName || '-') + '</td>' +
            '<td class="text-right">' + (Number(product.quantity) || 0).toLocaleString('id-ID') + '</td>' +
            '<td class="text-right">' + formatRupiah(product.totalSales) + '</td>' +
            '<td class="text-right text-success font-semibold">' + formatRupiah(product.totalShj) + '</td>' +
          '</tr>';
        }).join('');
      })
      .withFailureHandler(function(err) {
        showToast('Gagal memuat laporan: ' + (err && err.message ? err.message : 'Unknown error'), 'error');
        ['monthlyReportTotalSales', 'monthlyReportTotalShj', 'monthlyReportTotalHK'].forEach(function(id) { setText(id, '—'); });
        if (tbody) tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">Laporan tidak dapat dimuat.</td></tr>';
      })
      .getMonthlyTeamReport(month, salesId);
  }

  function populateSelectOptions(selectId, source, firstLabel, includeAll) {
    var select = document.getElementById(selectId);
    if (!select) return;

    var current = select.value;
    var html = '';
    if (includeAll) html += '<option value="ALL">' + escapeHtml(firstLabel || 'Semua') + '</option>';
    else html += '<option value="">' + escapeHtml(firstLabel || '-- Pilih --') + '</option>';

    var seen = {};
    (source || []).forEach(function(item) {
      var value = typeof item === 'string' ? item : (item.team_name || item.teamName || item.name || '');
      if (!value) return;
      if (selectId === 'inputTxTeam' && isNonTargetTeam(value)) return;
      var key = normalizeKey(value);
      if (seen[key]) return;
      seen[key] = true;
      html += '<option value="' + escapeHtml(value) + '">' + escapeHtml(value) + '</option>';
    });

    select.innerHTML = html;
    if (current && Array.prototype.some.call(select.options, function(opt) { return opt.value === current; })) {
      select.value = current;
    }
  }

  function populateFileCategories() {
    var select = document.getElementById('fileFilterCategory');
    if (!select) return;
    var current = select.value;
    var seen = {};
    var html = '<option value="ALL">Semua Kategori</option>';
    (appState.files || []).forEach(function(f) {
      var cat = String(f.category || 'Google Drive').trim();
      if (!cat) return;
      var key = normalizeKey(cat);
      if (seen[key]) return;
      seen[key] = true;
      html += '<option value="' + escapeHtml(cat) + '">' + escapeHtml(cat) + '</option>';
    });
    select.innerHTML = html;
    if (current && seen[normalizeKey(current)]) select.value = current;
  }

  function getActiveProductsForTeam(teamName) {
    var t = normalizeKey(teamName);
    if (!t || isNonTargetTeam(teamName)) return [];
    var filtered = (appState.priceMaster || []).filter(function(p) {
      var pTeam = normalizeKey(p.team_name || p.teamName || '');
      var status = normalizeKey(p.status || 'ACTIVE');
      return status !== 'INACTIVE' && pTeam === t;
    });

    if (filtered.length === 0) {
      filtered = (appState.products || []).map(function(p) {
        return {
          product_id: p.product_id || '',
          product_name: p.product_name || p.name || '',
          unit: p.unit || 'Box',
          cost_price: parseCleanNumber(p.cost_price || p.costPrice),
          selling_price: parseCleanNumber(p.selling_price || p.sellingPrice),
          shj: parseCleanNumber(p.shj)
        };
      }).filter(function(p) { return p.product_id || p.product_name; });
    }
    return filtered;
  }

  function setDashboardPeriod(period) {
    appState.dashboardPeriod = String(period || 'TODAY').toUpperCase();
    if (appState.dashboardPeriod !== 'CUSTOM') {
      appState.customStartDate = '';
      appState.customEndDate = '';
    }
    document.querySelectorAll('.seg-btn-modern').forEach(function(btn) { btn.classList.remove('active'); });
    var btnId = appState.dashboardPeriod === 'TODAY' ? 'segBtn-today' : appState.dashboardPeriod === 'WEEK' ? 'segBtn-week' : 'segBtn-month';
    var btn = document.getElementById(btnId);
    if (btn) btn.classList.add('active');
    updatePeriodDateDisplay();
    loadDashboardMetrics();
  }

  function applyCustomPeriod() {
    var start = document.getElementById('customStartDate');
    var end = document.getElementById('customEndDate');
    if (!start || !end || !start.value || !end.value) {
      showToast('Tanggal awal dan tanggal akhir wajib dipilih.', 'error');
      return;
    }
    if (start.value > end.value) {
      showToast('Tanggal awal tidak boleh lebih besar dari tanggal akhir.', 'error');
      return;
    }
    appState.dashboardPeriod = 'CUSTOM';
    appState.customStartDate = start.value;
    appState.customEndDate = end.value;
    document.querySelectorAll('.seg-btn-modern').forEach(function(btn) { btn.classList.remove('active'); });
    var customBtn = document.getElementById('segBtn-custom');
    if (customBtn) customBtn.classList.add('active');
    var dropdown = document.getElementById('customPeriodDropdown');
    if (dropdown) dropdown.style.display = 'none';
    updatePeriodDateDisplay();
    loadDashboardMetrics();
  }

  function updatePeriodDateDisplay() {
    var textEl = document.getElementById('periodDateBadgeText');
    if (!textEl) return;
    if (appState.dashboardPeriod === 'TODAY') textEl.textContent = 'Hari Ini';
    else if (appState.dashboardPeriod === 'WEEK') textEl.textContent = '7 Hari Terakhir';
    else if (appState.dashboardPeriod === 'MONTH') textEl.textContent = 'Bulan Ini';
    else if (appState.dashboardPeriod === 'CUSTOM') textEl.textContent = formatDateIndo(appState.customStartDate) + ' - ' + formatDateIndo(appState.customEndDate);
  }

  function setDashboardLoadState(state) {
    var ready = state === 'ready';
    var message = state === 'error' ? 'Data belum berhasil dimuat. Coba Sinkronisasi Live.' : 'Sedang memuat data';
    var view = document.getElementById('view-dashboard');
    if (view) view.setAttribute('aria-busy', state === 'loading' ? 'true' : 'false');
    ['salesTrendChart', 'salesDailyComparisonChart'].forEach(function(id) {
      var canvas = document.getElementById(id);
      if (canvas && canvas.parentElement) canvas.parentElement.setAttribute('data-chart-state', state);
    });
    if (ready) {
      setHtml('dashboardLoadStatus', '<span class="live-dot"></span> Live Sync');
      return;
    }
    setText('dashboardLoadStatus', state === 'error' ? 'Gagal memuat data' : 'Sedang memuat data');
    appState.dashboardData = null;
    ['kpiTotalOmset', 'kpiAchieveBadge', 'kpiCumulativeTarget', 'kpiDaysRemaining', 'kpiDaysPassedBadge',
      'kpiTopCanvasserName', 'kpiTopCanvasserAchieved', 'kpiTopMotorisName', 'kpiTopMotorisAchieved',
      'donutCenterPct', 'areaDonutCenterPct'].forEach(function(id) { setText(id, state === 'loading' ? 'Sedang memuat data' : '—'); });
    setText('kpiRemainingLabel', state === 'loading' ? 'Sedang memuat data' : 'Sisa: —');
    setStyle('kpiProgressBar', 'width', '0%');
    ['kpiTopCanvasserTeamBadge', 'kpiTopMotorisTeamBadge', 'teamPillLegend', 'areaPillLegend'].forEach(function(id) { setHtml(id, ''); });
    ['salesTrendChart', 'salesDailyComparisonChart', 'teamDonutChart', 'areaDonutChart'].forEach(destroyChart);
    setHtml('salesPerformanceTbody', '<tr><td colspan="6" class="text-center text-muted py-3">' + message + '</td></tr>');
    ['recentTxFeedList', 'activityFeedList'].forEach(function(id) {
      setHtml(id, '<div class="text-center text-muted py-3">' + message + '</div>');
    });
  }

  function loadDashboardMetrics() {
    if (appState.isLoadingMetadata) return;
    var requestSeq = ++appState.dashboardRequestSeq;
    appState.isLoadingDashboard = true;
    setDashboardLoadState('loading');

    var payload = {
      period: appState.dashboardPeriod,
      startDate: appState.dashboardPeriod === 'CUSTOM' ? appState.customStartDate : '',
      endDate: appState.dashboardPeriod === 'CUSTOM' ? appState.customEndDate : '',
      teamId: appState.dashboardTeamFilter || 'ALL',
      attendanceDate: appState.attendanceDate || ''
    };

    kchRun()
      .withSuccessHandler(function(res) {
        if (requestSeq !== appState.dashboardRequestSeq) return;
        appState.isLoadingDashboard = false;
        if (!res || !res.success) {
          setDashboardLoadState('error');
          showToast(res && res.message ? res.message : 'Gagal memuat dashboard.', 'error');
          return;
        }
        appState.dashboardData = res;
        appState.attendanceData = res.todayAttendance || [];
        renderDashboardData(res);
      })
      .withFailureHandler(function(err) {
        if (requestSeq !== appState.dashboardRequestSeq) return;
        appState.isLoadingDashboard = false;
        setDashboardLoadState('error');
        showToast('Gagal memuat dashboard: ' + (err && err.message ? err.message : 'Unknown error'), 'error');
      })
      .getDashboardMetrics(payload);
  }

  function renderDashboardData(data) {
    if (!data) return;
    renderKpiCards(data.kpi || {});
    renderSalesTrendChart(data.salesTrend || []);
    renderSalesLeaderboard(data.salesPerformance || [], appState.salesFilterTeam || 'ALL');
    renderDailySalesComparisonChart(data.salesPerformance || []);
    renderTeamDonutChart(data.teamAchievements || []);
    renderAreaDonutChart(data.areaAchievements || []);
    renderAttendanceGrid(data.todayAttendance || [], appState.attendanceTeamFilter || 'ALL');
    renderVisitPhotos();
    renderRecentTransactions(data.recentTransactions || []);
    renderActivityFeed(data.recentActivities || []);
    updatePeriodBadges();
    setDashboardLoadState('ready');
  }

  function renderKpiCards(kpi) {
    var totalSales = parseCleanNumber(kpi.totalSales);
    var totalTarget = parseCleanNumber(kpi.totalTarget || kpi.cumulativeTarget);
    var pct = Number(kpi.achievementPct || 0);
    var remaining = Math.max(totalTarget - totalSales, 0);

    setText('kpiTotalOmset', formatRupiah(totalSales));
    setHtml('kpiAchieveBadge', '<i class="fa-solid fa-arrow-trend-up"></i> ' + pct.toFixed(1).replace('.0', '') + '%');
    setText('kpiCumulativeTarget', formatRupiah(totalTarget));
    setHtml('kpiRemainingLabel', '<i class="fa-solid fa-flag-checkered"></i> Sisa: ' + formatRupiah(remaining));
    setStyle('kpiProgressBar', 'width', Math.min(Math.max(pct, 0), 100) + '%');

    var passed = parseCleanNumber(kpi.workDaysPassed);
    var remainingDays = parseCleanNumber(kpi.workDaysRemaining);
    var totalDays = parseCleanNumber(kpi.totalWorkDays);
    setText('kpiDaysRemaining', remainingDays + ' Hari');
    setText('kpiDaysPassedBadge', passed + ' / ' + totalDays + ' Hari');

    var topCan = kpi.topCanvasser || kpi.topSeniorCanvasser || null;
    var topMotor = kpi.topMotoris || null;

    setText('kpiTopCanvasserName', topCan ? topCan.name : '-');
    setText('kpiTopCanvasserAchieved', topCan ? formatRupiah(topCan.achieved) + ' (' + (topCan.pct || 0) + '%)' : 'Rp 0 (0%)');
    setHtml('kpiTopCanvasserTeamBadge', topCan ? '<span class="badge ' + getTeamBadgeClass(topCan.teamName) + '">' + escapeHtml(topCan.teamName) + '</span>' : '<span class="badge badge-neutral">-</span>');

    setText('kpiTopMotorisName', topMotor ? topMotor.name : '-');
    setText('kpiTopMotorisAchieved', topMotor ? formatRupiah(topMotor.achieved) + ' (' + (topMotor.pct || 0) + '%)' : 'Rp 0 (0%)');
    setHtml('kpiTopMotorisTeamBadge', topMotor ? '<span class="badge ' + getTeamBadgeClass(topMotor.teamName) + '">' + escapeHtml(topMotor.teamName) + '</span>' : '<span class="badge badge-neutral">-</span>');
  }

  function updatePeriodBadges() {
    var label = getPeriodLabel();
    setText('salesTrendPeriodBadge', label);
    setText('salesDailyChartPeriodBadge', label);
    setText('attendanceSectionTitle', 'Foto Absensi Tim');

  function getPeriodLabel() {
    if (appState.dashboardPeriod === 'TODAY') return 'Hari Ini';
    if (appState.dashboardPeriod === 'WEEK') return '7 Hari Terakhir';
    if (appState.dashboardPeriod === 'MONTH') return 'Bulan Ini';

  function renderSalesTrendChart(trend) {
    var canvas = document.getElementById('salesTrendChart');
    if (!canvas || typeof Chart === 'undefined') return;
    destroyChart('salesTrendChart');

    var labels = (trend || []).map(function(item) { return formatDateIndo(item.date); });
    var values = (trend || []).map(function(item) { return parseCleanNumber(item.amount); });
    var isToday = !appState.dashboardPeriod || appState.dashboardPeriod === 'TODAY';
    var targetValues = (trend || []).map(function(item) {
      return item.targetAmount === null || item.targetAmount === undefined ? null : parseCleanNumber(item.targetAmount);
    });
    var targetLabel = isToday ? 'Target Harian' : 'Target Periode';
    var achievedLabel = isToday ? 'Pencapaian Hari Ini' : 'Pencapaian Periode';
    var datasets = [];

    if (isToday) {
      datasets.push({
        label: targetLabel,
        data: targetValues,
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 4,
        fill: false,
        tension: 0,
        borderDash: [6, 4],
        borderColor: '#cbd5e1'
      });
    }

    datasets.push({
      label: achievedLabel,
      data: values,
      borderWidth: 2,
      pointRadius: 2.5,
      pointHoverRadius: 5,
      fill: true,
      tension: 0.35,
      backgroundColor: 'rgba(37,99,235,0.08)',
      borderColor: '#2563eb'
    });

    var salesTrendOptions = chartOptionsRupiah();
    if (appState.dashboardPeriod === 'MONTH') {
      var monthlyTargetScale = (appState.dashboardData && appState.dashboardData.salesPerformance ? appState.dashboardData.salesPerformance : []).reduce(function(maxTarget, sp) {
        return Math.max(maxTarget, parseCleanNumber(sp.monthlyTarget || sp.target));
      }, 0);
      if (monthlyTargetScale > 0) salesTrendOptions.scales.y.suggestedMax = monthlyTargetScale;
    }

    appState.charts.salesTrendChart = new Chart(canvas.getContext('2d'), {
      type: 'line',
      data: {
        labels: labels,
        datasets: datasets
      },
      options: salesTrendOptions
    });
  }

    appState.salesFilterTeam = teamName || 'ALL';

    renderSalesLeaderboard(data, appState.salesFilterTeam);

  function clearSalesFilter() {
    appState.salesFilterTeam = 'ALL';
    setStyle('salesFilterIndicator', 'display', 'none');

    renderSalesLeaderboard(data, 'ALL');

  function renderSalesLeaderboard(data, teamFilter) {
    var tbody = document.getElementById('salesPerformanceTbody');
    if (!tbody) return;
    teamFilter = teamFilter || 'ALL';

    var rows = (data || []).filter(function(sp) {
      if (isNonTargetTeam(sp.teamName)) return false;
      return teamFilter === 'ALL' || isTeamMatched(sp.teamName, teamFilter);
    });

    rows.sort(function(a, b) { return parseCleanNumber(b.achieved) - parseCleanNumber(a.achieved); });

    if (teamFilter !== 'ALL') {
      setStyle('salesFilterIndicator', 'display', 'inline-flex');
      setText('salesFilterText', 'Tim: ' + teamFilter);
    } else {
      setStyle('salesFilterIndicator', 'display', 'none');
    }

    if (rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">Belum ada data performa sales.</td></tr>';
      return;
    }

    tbody.innerHTML = rows.map(function(sp, idx) {
      var target = parseCleanNumber(sp.monthlyTarget || sp.target);
      var achieved = parseCleanNumber(sp.achieved);
      var pct = target > 0 ? Math.round((achieved / target) * 100) : parseCleanNumber(sp.percentage);
      var width = Math.min(Math.max(pct, 0), 100);
      var initial = String(sp.name || 'S').trim().charAt(0).toUpperCase() || 'S';
      var badge = getTeamBadgeClass(sp.teamName);
      return '<tr>' +
        '<td>' +
          '<div style="display:flex;align-items:center;gap:10px;min-width:180px;">' +
            '<div class="sales-avatar-mini">' + escapeHtml(initial) + '</div>' +
            '<div style="min-width:0;">' +
              '<div style="font-weight:700;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escapeHtml(sp.name || '-') + '</div>' +
              '<div style="font-size:10.5px;color:#64748b;">' + escapeHtml(sp.salesId || '-') + '</div>' +
            '</div>' +
          '</div>' +
        '</td>' +
        '<td><span class="badge ' + badge + '">' + escapeHtml(sp.teamName || '-') + '</span></td>' +
        '<td class="text-right">' + formatRupiah(target) + '</td>' +
        '<td class="text-right font-semibold">' + formatRupiah(achieved) + '</td>' +
        '<td class="text-center"><span class="badge ' + (pct >= 100 ? 'badge-success' : pct >= 75 ? 'badge-primary' : pct >= 50 ? 'badge-warning' : 'badge-danger') + '">' + pct + '%</span></td>' +
        '<td style="min-width:160px;">' +
          '<div style="display:flex;align-items:center;gap:8px;">' +
            '<div style="flex:1;height:7px;background:#f1f5f9;border-radius:10px;overflow:hidden;"><div style="height:100%;width:' + width + '%;background:#2563eb;border-radius:10px;"></div></div>' +
            '<span style="font-size:10.5px;font-weight:700;color:#64748b;min-width:33px;text-align:right;">' + pct + '%</span>' +
          '</div>' +
        '</td>' +
      '</tr>';
    }).join('');
  }

  function getPhotoTimeSortValue(timeValue) {
    var match = String(timeValue || '').trim().match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
    if (!match) return null;
    return (Number(match[1]) * 3600) + (Number(match[2]) * 60) + Number(match[3] || 0);
  }

  function sortPhotoCardsByTime(items) {
    return (items || []).slice().sort(function(a, b) {
      var timeA = getPhotoTimeSortValue(a && a.time);
      var timeB = getPhotoTimeSortValue(b && b.time);
      if (timeA === null && timeB === null) return 0;
      if (timeA === null) return 1;
      if (timeB === null) return -1;
      return timeA - timeB;
    });
  }

  function renderAttendanceGrid(data, teamFilter) {
    var containers = [
      document.getElementById('attendanceGridContainer'),
      document.getElementById('attendancePageGridContainer')
    ].filter(function(container) { return !!container; });
    if (containers.length === 0) return;
    teamFilter = teamFilter || 'ALL';

    var attendanceRows = data || [];
    var rows = attendanceRows.filter(function(item) {
      return teamFilter === 'ALL' || isTeamMatched(item.teamName, teamFilter);
    });
    rows = sortPhotoCardsByTime(rows);

    appState.attendanceData = attendanceRows;
    var countHtml = '<i class="fa-solid fa-user-check"></i> ' + rows.length + ' Hadir';
    setHtml('attendanceCountBadge', countHtml);
    setHtml('attendancePageCountBadge', countHtml);

    var attendedIds = {};
    attendanceRows.forEach(function(item) {
      var id = normalizeKey(item.salesId || item.id || '');
      if (id) attendedIds[id] = true;
    });
    var absentSales = (appState.attendanceSales || appState.sales || []).filter(function(sales) {
      var salesId = normalizeKey(sales.sales_id || sales.salesId || '');
      var isActive = normalizeKey(sales.status || 'ACTIVE') !== 'INACTIVE';
      return salesId && isActive && !attendedIds[salesId] &&
        (teamFilter === 'ALL' || isTeamMatched(sales.team_name || sales.teamName, teamFilter));
    });

    if (rows.length === 0 && absentSales.length === 0) {
      containers.forEach(function(container) {
        container.innerHTML = '<div class="attendance-loading-placeholder"><i class="fa-regular fa-image"></i><span>Belum ada dokumentasi absensi pada tanggal ini.</span></div>';
      });
      return;
    }

    var cardsHtml = rows.map(function(att) {
      var statusNorm = normalizeKey(att.status);
      var banner = '';
      if (statusNorm.indexOf('IZIN') > -1) banner = '<div class="att-photo-banner-overlay banner-izin"><i class="fa-solid fa-person-walking-arrow-right banner-icon"></i><span class="banner-text-label">IZIN</span><span class="banner-sublabel">Tidak melakukan absensi lapangan</span></div>';
      else if (statusNorm.indexOf('SAKIT') > -1) banner = '<div class="att-photo-banner-overlay banner-sakit"><i class="fa-solid fa-kit-medical banner-icon"></i><span class="banner-text-label">SAKIT</span><span class="banner-sublabel">Tidak melakukan absensi lapangan</span></div>';
      else if (statusNorm.indexOf('TIDAK HADIR') > -1 || statusNorm.indexOf('ALPHA') > -1) banner = '<div class="att-photo-banner-overlay banner-tidak-hadir"><i class="fa-solid fa-user-xmark banner-icon"></i><span class="banner-text-label">TIDAK HADIR</span><span class="banner-sublabel">Tidak ada dokumentasi absensi</span></div>';

      var statusClass = 'att-status-hadir';
      if (statusNorm.indexOf('TEPAT') > -1) statusClass = 'att-status-tepat-waktu';
      else if (statusNorm.indexOf('IZIN') > -1) statusClass = 'att-status-izin';
      else if (statusNorm.indexOf('SAKIT') > -1) statusClass = 'att-status-sakit';
      else if (statusNorm.indexOf('TIDAK') > -1 || statusNorm.indexOf('ALPHA') > -1) statusClass = 'att-status-tidak-hadir';

      var photo = att.photoUrl || '';
      var imgHtml = photo ? '<img src="' + escapeHtml(photo) + '" class="att-img" alt="Foto Absensi" onerror="this.style.display=\'none\';">' : '';
      var cardData = encodeURIComponent(JSON.stringify(att));

  function getSafeKchNewsUrl(url) {
    var value = String(url || '').trim();
    return /^https?:\/\//i.test(value) ? value : '';
  }

  function buildKchNewsBannerHtml(news) {
    var imageUrl = getSafeKchNewsUrl(news.imageUrl);
    var bannerText = news.bannerText || news.title || 'Berita dan informasi Kalbe';
    var bannerKicker = news.bannerKicker || 'KALBE UPDATE';
    var bannerSubtitle = news.bannerSubtitle || 'Berita dan informasi Kalbe';
    var imageHtml = imageUrl
      ? '<img class="kch-news-banner-image" src="' + escapeHtml(imageUrl) + '" alt="' + escapeHtml(news.title || 'Banner KCH News') + '" onerror="this.style.display=\'none\';">'
      : '';
    return imageHtml +
      '<span class="kch-news-banner-kicker">' + escapeHtml(bannerKicker) + '</span>' +
      '<strong>' + escapeHtml(bannerText) + '</strong>' +
      '<span>' + escapeHtml(bannerSubtitle) + '</span>' +
      '<i class="fa-solid fa-arrow-up-right-from-square"></i>';
  }

  function renderKchNews(newsRows) {
    var rows = (newsRows || []).filter(function(item) { return item && item.title; });
    var dashboardBanner = document.getElementById('kchNewsDashboardBanner');
    var dashboardDate = document.getElementById('kchNewsDashboardDate');
    var dashboardHeadline = document.getElementById('kchNewsDashboardHeadline');
    var dashboardSummary = document.getElementById('kchNewsDashboardSummary');
    var dashboardLink = document.getElementById('kchNewsDashboardLink');
    var pageList = document.getElementById('kchNewsPageList');
    var managerPanel = document.getElementById('kchNewsManagerPanel');
    if (managerPanel) {
      managerPanel.style.display = appState.canManageKchNews ? 'block' : 'none';
      if (appState.canManageKchNews && !getValue('kchNewsEditorDate')) resetKchNewsEditor();
    }

    if (rows.length === 0) {
      if (dashboardBanner) {
        dashboardBanner.classList.remove('has-image');
        dashboardBanner.href = '#';
        dashboardBanner.onclick = function(event) { event.preventDefault(); };
        dashboardBanner.innerHTML = '<span class="kch-news-banner-kicker">KCH NEWS</span><strong>Belum ada berita aktif</strong><span>Aktifkan berita di sheet KCH_NEWS</span><i class="fa-regular fa-newspaper"></i>';
      }
      if (dashboardDate) dashboardDate.innerHTML = '<i class="fa-regular fa-calendar"></i> -';
      setText('kchNewsDashboardHeadline', 'Belum ada berita aktif.');
      setText('kchNewsDashboardSummary', appState.canManageKchNews ? 'Buat artikel lewat menu Kelola Artikel KCH.' : 'Belum ada berita yang diterbitkan.');
      if (dashboardLink) dashboardLink.style.display = 'none';
      if (pageList) pageList.innerHTML = '<div class="chart-card kch-news-empty"><i class="fa-regular fa-newspaper"></i><strong>Belum ada berita aktif</strong><span>' + (appState.canManageKchNews ? 'Gunakan formulir Kelola Artikel KCH untuk menerbitkan artikel pertama.' : 'Berita yang diterbitkan akan tampil di sini.') + '</span></div>';
      return;
    }

    var latest = rows[0];
    var latestUrl = getSafeKchNewsUrl(latest.newsUrl);
    if (dashboardBanner) {
      dashboardBanner.classList.toggle('has-image', !!getSafeKchNewsUrl(latest.imageUrl));
      dashboardBanner.href = latestUrl || '#';
      dashboardBanner.target = latestUrl ? '_blank' : '';
      dashboardBanner.onclick = function(event) {
        if (!latestUrl && latest.content) { event.preventDefault(); openKchNewsArticle(latest.newsId); }
      };
      dashboardBanner.innerHTML = buildKchNewsBannerHtml(latest);
    }
    if (dashboardDate) dashboardDate.innerHTML = '<i class="fa-regular fa-calendar"></i> ' + escapeHtml(formatDateIndo(latest.date || ''));
    setText('kchNewsDashboardHeadline', latest.title || '-');

  function compressPhotoFile(file, callback) {
    if (!file || !/^image\//i.test(file.type || '')) {
      callback(null, 'Pilih file foto/gambar yang valid.');
      return;
    }
    var reader = new FileReader();
    reader.onload = function(event) {
      var image = new Image();
      image.onload = function() {
        var maxSide = 1600;
        var scale = Math.min(1, maxSide / Math.max(image.width, image.height));
        var canvas = document.createElement('canvas');
        var context = canvas.getContext('2d');
        var dataUrl = '';
        for (var attempt = 0; attempt < 8; attempt++) {
          canvas.width = Math.max(1, Math.round(image.width * scale));
          canvas.height = Math.max(1, Math.round(image.height * scale));
          context.clearRect(0, 0, canvas.width, canvas.height);
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          var quality = Math.max(0.45, 0.82 - (attempt % 4) * 0.12);
          dataUrl = canvas.toDataURL('image/jpeg', quality);
          if (dataUrl.length <= 4.5 * 1024 * 1024) break;
          if (attempt === 3) scale *= 0.8;
        }
        if (dataUrl.length > 4.5 * 1024 * 1024) {
          callback(null, 'Ukuran foto terlalu besar setelah dikompres. Pilih foto yang lebih kecil.');
          return;
        }
        callback(dataUrl, '');
      };
      image.onerror = function() { callback(null, 'Foto tidak dapat dibaca.'); };
      image.src = event.target.result;
    };
    reader.onerror = function() { callback(null, 'Foto gagal dibaca.'); };
    reader.readAsDataURL(file);
  }

  function submitPhotoUploadForm(event) {
    if (event) event.preventDefault();
    var type = appState.photoUploadType;
    var salesId = getValue('photoUploadSalesId');
    var date = getValue('photoUploadDate');
    var notes = String(getValue('photoUploadNotes') || '').trim();
    var fileInput = document.getElementById('photoUploadFile');
    var file = fileInput && fileInput.files ? fileInput.files[0] : null;
    if (!type || !salesId || !date || !notes || !file) {
      showToast('Lengkapi Sales ID, keterangan, tanggal, dan foto.', 'error');
      return;
    }
    var submitButton = document.getElementById('btnSubmitPhotoUpload');
    if (submitButton) {
      submitButton.disabled = true;
      submitButton.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Mengompres...';
    }

    var uploadGeneration = kchAuthGeneration;
    compressPhotoFile(file, function(imageDataUrl, errorMessage) {
      if (uploadGeneration !== kchAuthGeneration) return;
      if (errorMessage) {
        if (submitButton) {
          submitButton.disabled = false;
          submitButton.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Simpan';
        }
        showToast(errorMessage, 'error');
        return;
      }
      if (submitButton) submitButton.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Menyimpan...';
      kchRun()
        .withSuccessHandler(function(res) {
          if (submitButton) {
            submitButton.disabled = false;
            submitButton.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Simpan';
          }
          if (!res || !res.success) {
            showToast(res && res.message ? res.message : 'Gagal menyimpan foto.', 'error');
            return;
          }
          closePhotoUploadForm();
          showToast(res.message || 'Foto berhasil disimpan.', 'success');
          if (type === 'attendance') {
            handleAttendanceDateChange(date);
            loadMetadata();
          } else {

    });
  }

    refreshTransactionRowsForTeam(team);
  }

  function setupSalesAutocomplete() {
    var input = document.getElementById('inputTxSalesSearch');
    if (!input) return;
    input.addEventListener('input', function() { filterSalesDropdown(); });
    input.addEventListener('focus', function() { filterSalesDropdown(); });
    input.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') closeSalesAutocomplete();
    });
  }

  function filterSalesDropdown() {
    var input = document.getElementById('inputTxSalesSearch');
    var dropdown = document.getElementById('salesAutocompleteDropdown');
    var team = getValue('inputTxTeam');
    if (!input || !dropdown) return;

    var keyword = String(input.value || '').toLowerCase().trim();
    var rows = (appState.sales || []).filter(function(s) {
      if (isNonTargetTeam(s.team_name)) return false;
      if (team && !isTeamMatched(s.team_name, team)) return false;
      if (String(s.status || 'ACTIVE').toUpperCase() === 'INACTIVE') return false;
      if (!keyword) return true;
      var blob = [s.full_name, s.sales_id, s.team_name, s.area, s.phone].join(' ').toLowerCase();
      return blob.indexOf(keyword) > -1;
    }).slice(0, 30);

    if (rows.length === 0) {
      dropdown.innerHTML = '<div class="autocomplete-empty"><i class="fa-regular fa-user"></i><span>Tidak ada sales yang cocok.</span></div>';
      dropdown.style.display = 'block';
      return;
    }

    dropdown.innerHTML = rows.map(function(s) {
      var initial = String(s.full_name || 'S').trim().charAt(0).toUpperCase() || 'S';
      return '<div class="autocomplete-item" onclick="selectSales(\'' + jsQuote(s.sales_id || '') + '\')">' +
        '<div class="autocomplete-item-left">' +
          '<div class="autocomplete-item-avatar">' + escapeHtml(initial) + '</div>' +
          '<div class="autocomplete-item-meta"><span class="autocomplete-item-name">' + escapeHtml(s.full_name || '-') + '</span><span class="autocomplete-item-team">' + escapeHtml(s.team_name || '-') + '</span></div>' +
        '</div>' +
        '<span class="autocomplete-item-id-badge">' + escapeHtml(s.sales_id || '-') + '</span>' +
      '</div>';
    }).join('');
    dropdown.style.display = 'block';
  }

  function selectSales(salesId) {
    var sales = (appState.sales || []).find(function(s) { return normalizeKey(s.sales_id) === normalizeKey(salesId); });
    if (!sales) return;
    if (isNonTargetTeam(sales.team_name)) {
      showToast('Kategori ini hanya digunakan untuk absensi.', 'error');
      return;
    }
    var team = getValue('inputTxTeam');
    if (team && !isTeamMatched(sales.team_name, team)) {
      showToast('Sales tidak sesuai dengan kategori tim yang dipilih.', 'error');
      return;
    }

    appState.selectedSales = sales;
    appState.selectedSalesId = sales.sales_id || '';
    setValue('inputTxSales', sales.sales_id || '');
    var search = document.getElementById('inputTxSalesSearch');
    if (search) search.value = sales.full_name || sales.sales_id || '';
    setStyle('btnClearSalesSearch', 'display', 'flex');
    closeSalesAutocomplete();
    document.querySelectorAll('.item-product-select').forEach(function(select) { handleProductChange(select); });
    logClientActivity('SELECT_SALES', sales.sales_id || '', 'Memilih sales ' + (sales.full_name || sales.sales_id || ''));
  }

  function clearSalesSelection() {
    appState.selectedSales = null;
    appState.selectedSalesId = '';
    setValue('inputTxSales', '');
    var search = document.getElementById('inputTxSalesSearch');
    if (search) search.value = '';
    setStyle('btnClearSalesSearch', 'display', 'none');
    closeSalesAutocomplete();
  }

  function closeSalesAutocomplete() {
    var dropdown = document.getElementById('salesAutocompleteDropdown');
    if (dropdown) dropdown.style.display = 'none';
  }

  function ensureTransactionRows() {
    var tbody = document.getElementById('transactionItemsTbody');
    if (!tbody) return;
    if (tbody.children.length === 0) addItemRow();
    setupSalesAutocomplete();
    recalculateTransactionTotals();
  }

  function refreshTransactionRowsForTeam(teamName) {
    var tbody = document.getElementById('transactionItemsTbody');
    if (!tbody) return;
    if (!teamName || isNonTargetTeam(teamName)) {
      clearTransactionRowsOnly();
      addItemRow();
      return;
    }
    document.querySelectorAll('.item-product-select').forEach(function(select) {
      populateProductSelect(select, teamName, select.value);
    });
    recalculateTransactionTotals();
  }

  function updateTransactionQuantityValidity(input) {
    if (!input) return;
    var qty = Number(input.value);
    var valid = !input.validity.badInput && Number.isSafeInteger(qty) && qty >= 1;
    input.setCustomValidity(valid ? '' : 'Jumlah produk minimal 1 dan harus berupa bilangan bulat.');
  }

  function addItemRow() {
    var tbody = document.getElementById('transactionItemsTbody');
    if (!tbody) return;
    var teamName = getValue('inputTxTeam');
    if (teamName && isNonTargetTeam(teamName)) {
      showToast('Kategori ' + teamName + ' hanya untuk absensi.', 'error');
      return;
    }

    appState.itemRowCounter += 1;
    var rowId = 'tx-item-' + appState.itemRowCounter;
    var tr = document.createElement('tr');
    tr.dataset.rowId = rowId;
    tr.innerHTML =
      '<td><select class="form-control item-product-select" onchange="handleProductChange(this)" data-row-id="' + rowId + '"><option value="">-- Pilih Produk --</option></select></td>' +
      '<td><select class="form-control stock-source" aria-label="Sumber stok produk" style="min-width:190px" onchange="handleProductChange(this.closest(\'tr\').querySelector(\'.item-product-select\'))"></select></td>' +
      '<td class="text-center"><span class="item-stock-badge badge-stock-empty" data-role="stock">Stok -</span></td>' +
      '<td class="text-right"><span data-role="cost">Rp 0</span></td>' +
      '<td class="text-right"><span data-role="sell">Rp 0</span></td>' +
      '<td class="text-right"><span data-role="shj">Rp 0</span></td>' +
      '<td><input type="number" min="1" step="1" value="1" class="form-control" style="width:70px;text-align:center;margin:auto;" data-role="qty" required oninvalid="updateTransactionQuantityValidity(this)" oninput="updateTransactionQuantityValidity(this);recalculateTransactionTotals()"></td>' +
      '<td class="text-right font-semibold"><span data-role="subtotal">Rp 0</span></td>' +
      '<td class="text-center"><button type="button" class="btn btn-danger-soft btn-sm" onclick="removeItemRow(\'' + rowId + '\')"><i class="fa-solid fa-trash"></i></button></td>';
    tbody.appendChild(tr);
    if (typeof populateStockSource === 'function') populateStockSource(tr.querySelector('.stock-source'));
    populateProductSelect(tr.querySelector('.item-product-select'), teamName, '');
    recalculateTransactionTotals();
  }

  function populateProductSelect(select, teamName, selectedValue) {
    if (!select) return;
    var products = getActiveProductsForTeam(teamName);
    var html = '<option value="">-- Pilih Produk --</option>';
    products.forEach(function(p) {
      var id = p.product_id || p.productId || '';
      var name = p.product_name || p.productName || id;
      var unit = p.unit || 'Box';
      html += '<option value="' + escapeHtml(id) + '">' + escapeHtml(name + ' (' + unit + ')') + '</option>';
    });
    select.innerHTML = html;
    if (selectedValue && products.some(function(p) { return normalizeKey(p.product_id || p.productId) === normalizeKey(selectedValue); })) select.value = selectedValue;
  }

  function handleProductChange(select) {
    var tr = select && select.closest('tr');
    if (!tr) return;
    var teamName = getValue('inputTxTeam');
    var productId = select.value;
    var product = findPriceProduct(productId, teamName);
    updateProductRowUI(tr, product);
    recalculateTransactionTotals();
  }

  function findPriceProduct(productId, teamName) {
    if (!productId) return null;
    var normId = normalizeKey(productId);
    var normTeam = normalizeKey(teamName);
    var exact = (appState.priceMaster || []).find(function(p) {
      return normalizeKey(p.product_id || p.productId) === normId && normalizeKey(p.team_name || p.teamName) === normTeam;
    });
    if (exact) return exact;
    return (appState.products || []).find(function(p) { return normalizeKey(p.product_id || p.productId) === normId; }) || null;
  }

  function updateProductRowUI(tr, product) {
    var cost = product ? parseCleanNumber(product.cost_price || product.costPrice) : 0;
    var sell = product ? parseCleanNumber(product.selling_price || product.sellingPrice) : 0;
    var shj = sell - cost;
    var stockInfo = product ? findInventory(product.product_id || product.productId) : null;
    var productMaster = product ? (appState.products || []).find(function(item) {
      return normalizeKey(item.product_id || item.productId) === normalizeKey(product.product_id || product.productId);
    }) || product : null;

    var costEl = tr.querySelector('[data-role="cost"]');
    var sellEl = tr.querySelector('[data-role="sell"]');
    var shjEl = tr.querySelector('[data-role="shj"]');
    var stockEl = tr.querySelector('[data-role="stock"]');
    if (costEl) costEl.textContent = formatRupiah(cost);
    if (sellEl) sellEl.textContent = formatRupiah(sell);
    if (shjEl) shjEl.textContent = formatRupiah(shj);

    if (stockEl) {
      if (!stockInfo) {
        stockEl.className = 'item-stock-badge badge-stock-empty';
        stockEl.innerHTML = '<span class="badge-dot dot-neutral"></span> Stok -';
      } else {
        var source = typeof stockReadLineSource === 'function' ? stockReadLineSource(tr) : {};
        var distributor = String(getValue('inputTxDistributor') || '').toLowerCase();
        if (source.distributorId && appState.stockPickup && appState.stockPickup.data) {
          var chosen = appState.stockPickup.data.distributors.find(function(d) { return normalizeKey(d.distributor_id) === normalizeKey(source.distributorId); });
          if (chosen) distributor = String(chosen.distributor_name).toLowerCase();
        }
        var isGeubrina = distributor.indexOf('ap. geubrina rizki') === 0;
        var selectedStock = isGeubrina
          ? stockInfo['AP. Geubrina Rizki']
          : stockInfo['PT. Global Mitra Prima'];
        var stock = distributor
          ? parseCleanNumber(selectedStock)
          : parseCleanNumber(stockInfo['PT. Global Mitra Prima']) + parseCleanNumber(stockInfo['AP. Geubrina Rizki']);
        var held = typeof stockSourceAvailability === 'function' ? stockSourceAvailability(tr,product.product_id || product.productId) : null;
        if (held && !held.known) { stockEl.className = 'item-stock-badge badge-stock-empty'; stockEl.textContent = 'Stok sumber belum dimuat'; return; }
        if (held) stock = held.quantity;
        var min = parseCleanNumber(productMaster && (productMaster.min_stock || productMaster.minStock)) || 50;
        if (stock <= 0) {
          stockEl.className = 'item-stock-badge badge-stock-danger';
          stockEl.innerHTML = '<span class="badge-dot dot-danger"></span> Habis (' + stock + ')';
        } else if (stock <= min) {
          stockEl.className = 'item-stock-badge badge-stock-warning';
          stockEl.innerHTML = '<span class="badge-dot dot-warning"></span> Menipis (' + stock + ')';
        } else {
          stockEl.className = 'item-stock-badge badge-stock-ready';
          stockEl.innerHTML = '<span class="badge-dot dot-ready"></span> Siap (' + stock + ')';
        }
      }
    }
  }

  function handleDistributorChange() {
    var tbody = document.getElementById('transactionItemsTbody');
    if (!tbody) return;
    Array.prototype.forEach.call(tbody.querySelectorAll('.item-product-select'), function(select) {
      if (select.value) handleProductChange(select);
    });
  }

  function findInventory(productId) {
    var key = normalizeKey(productId);
    return (appState.inventory || []).find(function(item) { return normalizeKey(item.product_id || item.productId) === key; }) || null;
  }

  function removeItemRow(rowId) {
    var tr = document.querySelector('tr[data-row-id="' + cssEscapeSimple(rowId) + '"]');
    if (tr && tr.parentNode) tr.parentNode.removeChild(tr);
    var tbody = document.getElementById('transactionItemsTbody');
    if (tbody && tbody.children.length === 0) addItemRow();
    recalculateTransactionTotals();
  }

  function clearTransactionRowsOnly() {
    var tbody = document.getElementById('transactionItemsTbody');
    if (tbody) tbody.innerHTML = '';
  }

  function recalculateTransactionTotals() {
    var tbody = document.getElementById('transactionItemsTbody');
    if (!tbody) return;
    var teamName = getValue('inputTxTeam');
    var totalSales = 0;
    var totalCost = 0;
    var totalShj = 0;

    Array.prototype.forEach.call(tbody.querySelectorAll('tr'), function(tr) {
      var productIdEl = tr.querySelector('.item-product-select');
      var qtyEl = tr.querySelector('[data-role="qty"]');
      var productId = productIdEl ? productIdEl.value : '';
      var qty = Math.max(0, parseInt(qtyEl ? qtyEl.value : 0, 10) || 0);
      var product = findPriceProduct(productId, teamName);
      var cost = product ? parseCleanNumber(product.cost_price || product.costPrice) : 0;
      var sell = product ? parseCleanNumber(product.selling_price || product.sellingPrice) : 0;
      var shj = sell - cost;
      var subtotal = sell * qty;
      totalSales += subtotal;
      totalCost += cost * qty;
      totalShj += shj * qty;
      var subtotalEl = tr.querySelector('[data-role="subtotal"]');
      if (subtotalEl) subtotalEl.textContent = formatRupiah(subtotal);
    });

    setText('displayTotalSales', formatRupiah(totalSales));
    setText('displayTotalCost', formatRupiah(totalCost));
    setText('displayTotalShj', formatRupiah(totalShj));
  }

  function setDefaultTransactionDate() {
    var input = document.getElementById('inputTxDate');
    if (input && !input.value) input.value = getLocalDateInputValue();
  }

  function txClientStorageKey() {
    if (!appState.user || !appState.user.uid) throw new Error('Silakan masuk ulang sebelum menyimpan transaksi.');
    return 'kch.tx.pending.v1:' + window.location.hostname + ':' + appState.user.uid;
  }

  function txClientNewId() {
    if (window.crypto && window.crypto.randomUUID) return 'REQ-' + window.crypto.randomUUID();
    var bytes = new Uint8Array(16);
    if (!window.crypto || !window.crypto.getRandomValues) throw new Error('Browser belum mendukung kode kiriman aman. Gunakan browser yang diperbarui.');
    window.crypto.getRandomValues(bytes);
    return 'REQ-' + Array.from(bytes).map(function(byte) { return ('0' + byte.toString(16)).slice(-2); }).join('');
  }

  function txClientStore(pending) {
    var key = txClientStorageKey();
    if (!pending) { window.sessionStorage.removeItem(key); return; }
    // Only the opaque request ID is retained across refresh/logout. No token,
    // transaction notes, prices or customer data is stored in browser storage.
    var text = JSON.stringify({ requestId: pending.requestId });
    window.sessionStorage.setItem(key, text);
    if (window.sessionStorage.getItem(key) !== text) throw new Error('Penyimpanan sesi browser belum tersedia.');
  }

  function txClientLock(locked) {
    var fields = document.getElementById('txFormFields');
    if (fields) fields.disabled = !!locked;
    var editFields = document.getElementById('txEditFormFields');
    if (editFields) editFields.disabled = !!locked;
    var pickupFields = document.getElementById('pickupFormFields');
    if (pickupFields) pickupFields.disabled = !!locked;
  }

  function txClientStatus(message, showRetry) {
    [['txRequestStatus', 'txRequestStatusText', 'txRequestCode', 'btnRetryTxRequest', 'btnCheckTxRequest'],
      ['editTxRequestStatus', 'editTxRequestStatusText', 'editTxRequestCode', 'btnRetryTxEditRequest', 'btnCheckTxEditRequest'],
      ['pickupRequestStatus', 'pickupRequestStatusText', 'pickupRequestCode', 'btnRetryPickupRequest', 'btnCheckPickupRequest']].forEach(function(ids) {
      var box = document.getElementById(ids[0]), text = document.getElementById(ids[1]), code = document.getElementById(ids[2]);
      var retry = document.getElementById(ids[3]), check = document.getElementById(ids[4]);
      if (box) box.style.display = message ? 'block' : 'none';
      if (text) text.textContent = message || '';
      if (code) code.textContent = appState.pendingTransaction ? appState.pendingTransaction.requestId : '';
      if (retry) { retry.style.display = showRetry ? 'inline-flex' : 'none'; retry.disabled = !!appState.isSubmittingTransaction; }
      if (check) check.disabled = !!appState.isSubmittingTransaction;
    });
  }

  function restorePendingSalesTransaction() {
    if (appState.user && appState.user.role === 'GUEST') return;
    var saved;
    try {
      saved = JSON.parse(window.sessionStorage.getItem(txClientStorageKey()) || 'null');
      if (!saved || !/^[A-Za-z0-9_-]{16,96}$/.test(saved.requestId || '')) return;
    } catch (err) { return; }
    appState.pendingTransaction = { requestId: saved.requestId, payload: null };
    txClientLock(true);
    txClientStatus('Ada kiriman sebelumnya. Memeriksa hasil sebelum menerima transaksi baru…', false);
    checkPendingSalesTransaction();
  }

  function txClientClear() {
    // Keep the current session locked if removing the recovery ID fails.
    txClientStore(null);
    appState.pendingTransaction = null;
    txClientLock(false);
    txClientStatus('', false);
  }

  function txClientHandleResult(result) {
    appState.isSubmittingTransaction = false;
    var btn = document.getElementById('btnSubmitTx');
    if (btn) { btn.disabled = false; btn.textContent = 'Simpan Transaksi Penjualan'; }
    var editBtn = document.getElementById('btnSubmitTxEdit');
    if (editBtn) { editBtn.disabled = false; editBtn.textContent = 'Simpan perubahan'; }
    var pickupBtn = document.getElementById('btnSubmitPickup');
    if (pickupBtn) { pickupBtn.disabled = false; pickupBtn.textContent = 'Simpan pengambilan'; }
    if (result && result.success && result.state === 'COMMITTED') {
      try { txClientClear(); }
      catch (err) { txClientStatus('Transaksi ' + result.transactionId + ' sudah tersimpan, tetapi browser belum dapat membersihkan status kiriman. Periksa hasil lagi sebelum transaksi baru.', false); return; }
      showToast(result.message + ' ' + result.transactionId + (result.operation === 'PICKUP' ? '' : ' — ' + formatRupiah(result.totalSales)), 'success');
      if (result.operation === 'PICKUP') resetPickupForm();
      else if (result.operation === 'EDIT') closeSalesTransactionEdit();
      else resetSalesTransactionForm();
      // Read authoritative balances; never subtract again on an idempotent replay.
      loadMetadata();
      if (appState.currentView === 'riwayat') loadTransactions(1);
      return;
    }
    if (result && result.terminal && result.state === 'FAILED') {
      try { txClientClear(); }
      catch (err) { txClientStatus('Kiriman ditolak tanpa perubahan stok. Browser belum dapat membersihkan status; periksa hasil lagi.', false); return; }
      showToast(result.message || 'Transaksi ditolak. Periksa isian sebelum mencoba lagi.', 'error');
      return;
    }
    txClientLock(true);
    txClientStatus(result && result.message || 'Hasil kiriman belum pasti. Periksa hasil sebelum mencoba transaksi baru.', false);
  }

  function txClientSend(payload) {
    appState.isSubmittingTransaction = true;
    txClientLock(true);
    // Routine progress stays on the submit button; recovery UI is for uncertainty.
    txClientStatus('', false);
    var btn = document.getElementById('btnSubmitTx');
    if (btn) { btn.disabled = true; btn.textContent = 'Menyimpan…'; }
    var editBtn = document.getElementById('btnSubmitTxEdit');
    if (editBtn && payload.transactionId) { editBtn.disabled = true; editBtn.textContent = 'Menyimpan…'; }
    var runner = kchRun().withSuccessHandler(txClientHandleResult).withFailureHandler(function(err) {
      appState.isSubmittingTransaction = false;
      txClientLock(true);
      txClientStatus('Belum dapat memastikan hasil kiriman. Klik Periksa hasil. ' + (err && err.message || ''), false);
    });
    var pickupBtn = document.getElementById('btnSubmitPickup');
    if (pickupBtn && payload.operation === 'PICKUP') { pickupBtn.disabled = true; pickupBtn.textContent = 'Menyimpan…'; }
    if (payload.operation === 'PICKUP') runner.saveStockPickup(payload);
    else if (payload.transactionId) runner.editSalesTransaction(payload);
    else runner.saveSalesTransaction(payload);
  }

  function retryPendingSalesTransaction() {
    var pending = appState.pendingTransaction;
    if (appState.isSubmittingTransaction || !pending || !pending.payload) return;
    // Same payload and same request ID, never a new invoice on retry.
    txClientSend(pending.payload);
  }

  function checkPendingSalesTransaction() {
    var pending = appState.pendingTransaction;
    if (!pending || appState.isSubmittingTransaction) return;
    appState.isSubmittingTransaction = true;
    txClientStatus('Memeriksa hasil kiriman…', false);
    kchRun().withSuccessHandler(function(result) {
      if (result && result.state === 'NOT_FOUND' && !result.blocked) {
        appState.isSubmittingTransaction = false;
        if (pending.payload) {
          txClientLock(true);
          txClientStatus('Kiriman belum tercatat. Klik Coba simpan lagi untuk mengirim detail yang sama dengan kode yang sama.', true);
        } else {
          txClientLock(false);
          var btn = document.getElementById('btnSubmitTx');
          if (btn) btn.disabled = false;
          var editBtn = document.getElementById('btnSubmitTxEdit');
          if (editBtn) editBtn.disabled = false;
          var pickupBtn = document.getElementById('btnSubmitPickup');
          if (pickupBtn) pickupBtn.disabled = false;
          txClientStatus('Kiriman belum tercatat. Isi detail transaksi atau buka kembali edit faktur; kode kiriman sebelumnya tetap digunakan.', false);
        }
        return;
      }
      txClientHandleResult(result);
    }).withFailureHandler(function(err) {
      appState.isSubmittingTransaction = false;
      txClientLock(true);
      txClientStatus('Status kiriman belum dapat diperiksa. ' + (err && err.message || 'Coba lagi sebentar.'), false);
    }).getSalesTransactionRequestStatus(pending.requestId);
  }

  function submitSalesTransaction(event) {
    if (appState.user && appState.user.role === 'GUEST') { if (typeof event !== 'undefined' && event && event.preventDefault) event.preventDefault(); showToast('Akun Tamu hanya boleh melihat data.', 'error'); return; }
    if (event) event.preventDefault();
    if (appState.isSubmittingTransaction) return;

    var teamName = getValue('inputTxTeam');
    var salesId = getValue('inputTxSales');
    var distributor = getValue('inputTxDistributor');
    var date = getValue('inputTxDate');
    var notes = getValue('inputTxNotes');

    if (!teamName) {
      showToast('Pilih kategori tim terlebih dahulu.', 'error');
      return;
    }
    if (isNonTargetTeam(teamName)) {
      showToast('Kategori ' + teamName + ' hanya digunakan untuk absensi.', 'error');
      return;
    }
    if (!salesId) {
      showToast('Pilih personil sales terlebih dahulu.', 'error');
      return;
    }
    if (!distributor) {
      showToast('Pilih distributor/channel.', 'error');
      return;
    }
    if (!date) {
      showToast('Tanggal penjualan wajib diisi.', 'error');
      return;
    }

    var tbody = document.getElementById('transactionItemsTbody');
    var items = [];
    if (tbody) {
      Array.prototype.forEach.call(tbody.querySelectorAll('tr'), function(tr) {
        var productIdEl = tr.querySelector('.item-product-select');
        var qtyEl = tr.querySelector('[data-role="qty"]');
        var productId = productIdEl ? String(productIdEl.value || '').trim() : '';
        var qty = Number(qtyEl ? qtyEl.value : 0);
        if (!productId) return;
        var product = findPriceProduct(productId, teamName);
        if (!product) return;
        var cost = parseCleanNumber(product.cost_price || product.costPrice);
        var sell = parseCleanNumber(product.selling_price || product.sellingPrice);
        var source = typeof stockReadLineSource === 'function' ? stockReadLineSource(tr) : {};
        items.push(Object.assign({
          productId: productId,
          qty: qty,
          costPrice: cost,
          sellingPrice: sell,
          shj: sell - cost
        },source));
      });
    }

    if (items.length === 0) {
      showToast('Pilih minimal satu produk.', 'error');
      return;
    }
    if (items.some(function(item) { return !Number.isSafeInteger(item.qty) || item.qty <= 0; })) {
      showToast('Jumlah produk minimal 1 dan harus berupa bilangan bulat.', 'error');
      return;
    }

    var pending = appState.pendingTransaction;
    if (pending && pending.payload) {
      showToast('Periksa hasil kiriman sebelumnya sebelum membuat transaksi baru.', 'info');
      return;
    }
    var payload = {
      date: date, teamName: teamName, salesId: salesId, distributor: distributor,
      items: items, notes: notes
    };
    try {
      payload.requestId = pending ? pending.requestId : txClientNewId();
      appState.pendingTransaction = { requestId: payload.requestId, payload: payload };
      txClientStore(appState.pendingTransaction);
    } catch (err) {
      appState.pendingTransaction = pending || null;

  function addEditTransactionRow(item) {
    var editing = appState.transactionEdit, body = document.getElementById('editTxItems');

    (editing.items || []).forEach(function(original) {
      if (!products.some(function(product) { return normalizeKey(product.id) === normalizeKey(original.productId); })) products.push({ id: original.productId, name: original.productName });
    });
    var seen = Object.create(null);
