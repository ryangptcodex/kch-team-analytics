  function updateEditTransactionTotals() {
    var body = document.getElementById('editTxItems');
    if (!body || !appState.transactionEdit) return;
    var cents = 0, valid = true;
    Array.prototype.forEach.call(body.querySelectorAll('tr'), function(row) {
      var price = editTransactionPrice(row.querySelector('.edit-product').value);
      var qty = Number(row.querySelector('.edit-qty').value);
      var rowValid = price && Number.isSafeInteger(qty) && qty > 0;
      var subtotal = rowValid ? Math.round(price.sell * 100) * qty : 0;
      if (!rowValid || !Number.isSafeInteger(subtotal)) valid = false;
      cents += subtotal;
      row.querySelector('.edit-price').textContent = price ? formatRupiah(price.sell) : '—';
      row.querySelector('.edit-subtotal').textContent = rowValid ? formatRupiah(subtotal / 100) : '—';
      row.querySelector('.edit-price-note').textContent = price ? (price.historical ? 'Harga faktur asli' : 'Harga master saat ini') : '';
    });
    setText('editTxTotal', valid && Number.isSafeInteger(cents) ? formatRupiah(cents / 100) : '—');
  }

  function submitSalesTransactionEdit(event) {
    if (event) event.preventDefault();
    var editing = appState.transactionEdit;
    if (!editing || appState.isSubmittingTransaction) return;
    if (appState.pendingTransaction && appState.pendingTransaction.payload) { showToast('Periksa hasil kiriman sebelumnya.', 'info'); return; }
    var reason = String(getValue('editTxReason') || '').trim();
    if (reason.length < 3 || reason.length > 500) { showToast('Isi alasan edit sepanjang 3 sampai 500 karakter.', 'error'); return; }
    var body = document.getElementById('editTxItems'), items = [], invalid = false;
    Array.prototype.forEach.call(body.querySelectorAll('tr'), function(row) {
      var productId = row.querySelector('.edit-product').value, qty = Number(row.querySelector('.edit-qty').value), price = editTransactionPrice(productId);
      if (!productId || !price || !Number.isSafeInteger(qty) || qty <= 0) { invalid = true; return; }
      items.push(Object.assign({ productId: productId, qty: qty, costPrice: price.cost, sellingPrice: price.sell },typeof stockReadLineSource === 'function' ? stockReadLineSource(row,true) : {}));
    });
    if (invalid || !items.length) { showToast('Pilih minimal satu produk dengan jumlah bulat minimal 1.', 'error'); return; }
    var pending = appState.pendingTransaction;
    var payload = { transactionId: editing.header.id, expectedRevision: editing.revision, salesId: editing.header.salesId, date: getValue('editTxDate'), distributor: getValue('editTxDistributor'), notes: getValue('editTxNotes'), reason: reason, items: items };
    if (!payload.date || !payload.distributor) { showToast('Tanggal dan distributor wajib diisi.', 'error'); return; }
    try {
      payload.requestId = pending ? pending.requestId : txClientNewId();
      appState.pendingTransaction = { requestId: payload.requestId, payload: payload };
      txClientStore(appState.pendingTransaction);
    } catch (err) {
      appState.pendingTransaction = pending || null;
      showToast('Perubahan belum dikirim. Izinkan penyimpanan sesi browser. ' + err.message, 'error');
      return;
    }
    txClientSend(payload);
  }

function renderDriveFiles() {
    var container = document.getElementById('driveFilesGridContainer');
    if (!container) return;
    var keyword = String(getValue('fileSearchInput') || '').toLowerCase().trim();
    var category = getValue('fileFilterCategory') || 'ALL';
    var rows = (appState.files || []).filter(function(f) {
      var blob = [f.file_name, f.category, f.drive_url, f.update_date].join(' ').toLowerCase();
      return (!keyword || blob.indexOf(keyword) > -1) && (category === 'ALL' || normalizeKey(f.category) === normalizeKey(category));
    });

    setHtml('filesTotalCountBadge', '<i class="fa-solid fa-folder-open"></i> ' + rows.length + ' Berkas');

    if (rows.length === 0) {
      container.innerHTML = '<div class="attendance-loading-placeholder"><i class="fa-regular fa-folder-open"></i><span>Dokumen tidak ditemukan.</span></div>';
      return;
    }

    container.innerHTML = rows.map(function(f) {
      var url = f.drive_url || '';
      var name = String(f.file_name || 'Dokumen KCH');
      var cat = String(f.category || 'Google Drive');
      var blob = (name + ' ' + cat + ' ' + url).toLowerCase();
      var isPdf = /\.pdf(?:$|[?#])/i.test(url) || /(^|[^a-z])pdf([^a-z]|$)/i.test(name + ' ' + cat);
      var isDrive = /drive\.google\.com|docs\.google\.com|googleusercontent\.com/i.test(url);

      var icon = 'fa-file-lines';
      var iconStyle = 'background-color:#eff6ff;color:#2563eb;';
      if (isPdf) {
        icon = 'fa-file-pdf';
        iconStyle = 'background-color:#fef2f2;color:#dc2626;';
      } else if (isDrive) {
        icon = 'fa-google-drive';
        iconStyle = 'background-color:#ecfdf5;color:#16a34a;';
      } else if (blob.indexOf('excel') > -1 || /\.xlsx?(?:$|[?#])/i.test(url)) {
        icon = 'fa-file-excel';
        iconStyle = 'background-color:#ecfdf5;color:#16a34a;';
      } else if (blob.indexOf('word') > -1 || /\.docx?(?:$|[?#])/i.test(url)) {
        icon = 'fa-file-word';
        iconStyle = 'background-color:#eff6ff;color:#2563eb;';
      } else if (blob.indexOf('powerpoint') > -1 || blob.indexOf('ppt') > -1 || /\.pptx?(?:$|[?#])/i.test(url)) {
        icon = 'fa-file-powerpoint';
        iconStyle = 'background-color:#fff7ed;color:#ea580c;';
      } else if (blob.indexOf('folder') > -1) {
        icon = 'fa-folder-open';
        iconStyle = 'background-color:#eff6ff;color:#2563eb;';
      }

      var iconPrefix = icon === 'fa-google-drive' ? 'fa-brands' : 'fa-solid';

      return '<div class="file-card">' +
        '<div class="file-icon-box" style="' + iconStyle + '"><i class="' + iconPrefix + ' ' + icon + '"></i></div>' +
        '<div class="file-name">' + escapeHtml(name) + '</div>' +
        '<div class="file-info">' + escapeHtml(cat) + '</div>' +
        '<div class="file-info">Update: ' + escapeHtml(formatDateIndo(f.update_date || '-')) + '</div>' +
        '<a href="' + escapeHtml(url || 'https://drive.google.com') + '" target="_blank" rel="noopener" class="btn btn-outline btn-sm"><i class="fa-solid fa-arrow-up-right-from-square"></i> Buka</a>' +
      '</div>';
    }).join('');
  }

  function exportTransactionsToCSV() {
    var search = String(getValue('txSearchKeyword') || '').trim().toLowerCase();
    var team = getValue('txFilterTeam') || 'ALL';
    var distributor = getValue('txFilterDistributor') || 'ALL';
    var date = getValue('txFilterDate') || '';
    showToast('Menyiapkan file CSV...', 'info');

    kchRun()
      .withSuccessHandler(function(res) {
        if (!res || !res.success) {
          showToast(res && res.message ? res.message : 'Export gagal.', 'error');
          return;
        }
        var rows = res.data || [];
        var csv = [['ID Faktur', 'Tanggal', 'Nama Sales', 'Kategori Tim', 'Distributor', 'Total Modal', 'Total Penjualan', 'Total SHJ']];
        rows.forEach(function(item) {
          csv.push([
            item.id || '',
            item.date || '',
            item.salesName || '',
            item.teamName || '',
            item.distributor || '',
            parseCleanNumber(item.totalCost),
            parseCleanNumber(item.totalSales),
            parseCleanNumber(item.totalShj)
          ]);
        });
        downloadTextFile('KCH_Transactions_' + getLocalDateInputValue() + '.csv', csv.map(function(row) {
          return row.map(csvEscape).join(',');
        }).join('\r\n'), 'text/csv;charset=utf-8;');
        showToast('CSV berhasil dibuat.', 'success');
      })
      .withFailureHandler(function(err) {
        showToast('Export gagal: ' + (err && err.message ? err.message : 'Unknown error'), 'error');
      })
      .getAllTransactionsForExport(search, team, distributor, date);
  }

        html += '<script>window.onload=function(){window.print();}<\/script></body></html>';
        win.document.open();
        win.document.write(html);
        win.document.close();
      })
      .withFailureHandler(function(err) {
        showToast('Laporan gagal dibuat: ' + (err && err.message ? err.message : 'Unknown error'), 'error');
      })
      .getAllTransactionsForExport(search, team, distributor, date);
  }

  function chartOptionsRupiah() {
    return {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: { display: true, position: 'top', labels: { boxWidth: 9, boxHeight: 9, font: { size: 10 } } },
        tooltip: { callbacks: { label: function(ctx) { return ' ' + ctx.dataset.label + ': ' + formatRupiah(ctx.raw); } } }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 9.5 }, color: '#64748b' } },
        y: { beginAtZero: true, grid: { color: '#eef2f7' }, ticks: { font: { size: 9.5 }, color: '#64748b', callback: function(value) { return formatCompactRupiah(value); } } }
      }
    };
  }

  function formatCompactRupiah(value) {
    var n = parseCleanNumber(value);
    if (n >= 1000000000) return 'Rp ' + (n / 1000000000).toFixed(1).replace('.0', '') + ' M';
    if (n >= 1000000) return 'Rp ' + (n / 1000000).toFixed(1).replace('.0', '') + ' Jt';
    if (n >= 1000) return 'Rp ' + (n / 1000).toFixed(0) + ' Rb';
    return 'Rp ' + n.toLocaleString('id-ID');
  }

  function destroyChart(name) {
    if (appState.charts[name]) {
      try { appState.charts[name].destroy(); } catch (e) {}
      appState.charts[name] = null;
    }
  }

  function jsQuote(value) {
    return String(value === null || value === undefined ? '' : value).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r/g, '\\r').replace(/\n/g, '\\n');
  }

  function csvEscape(value) {
    var str = String(value === null || value === undefined ? '' : value);
    if (/[",\n\r]/.test(str)) return '"' + str.replace(/"/g, '""') + '"';
    return str;
  }

  function downloadTextFile(filename, content, mime) {
    var blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function() {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 100);
  }

  function getLocalDateInputValue() {
    var d = new Date();
    var y = d.getFullYear();
    var m = ('0' + (d.getMonth() + 1)).slice(-2);
    var day = ('0' + d.getDate()).slice(-2);
    return y + '-' + m + '-' + day;
  }

  function normalizePhone(phone) {
    var str = String(phone || '').replace(/[^0-9+]/g, '');
    if (str.indexOf('+62') === 0) return str.slice(1);
    if (str.indexOf('62') === 0) return str;
    if (str.indexOf('0') === 0) return '62' + str.slice(1);
    return str;
  }

  function cssEscapeSimple(value) {
    return String(value || '').replace(/[^a-zA-Z0-9_-]/g, '\\$&');
  }

  function getValue(id) {
    var el = document.getElementById(id);
    return el ? el.value : '';
  }

  function setValue(id, value) {
    var el = document.getElementById(id);
    if (el) el.value = value === null || value === undefined ? '' : value;
  }

  function setText(id, value) {
    var el = document.getElementById(id);
    if (el) {
      el.textContent = value === null || value === undefined ? '' : value;
      if (el.setAttribute) el.setAttribute('data-loading', value === 'Sedang memuat data' ? 'true' : 'false');
    }
  }

  function setHtml(id, value) {
    var el = document.getElementById(id);
    if (el) {
      el.innerHTML = value === null || value === undefined ? '' : value;
      if (el.setAttribute) el.setAttribute('data-loading', 'false');
    }
  }

  function setStyle(id, property, value) {
    var el = document.getElementById(id);
    if (el) el.style[property] = value;
  }
</script>
