<script>
  function scoreState() {
    if (!appState.score) appState.score = { seq: 0, setupSeq: 0, setup: null, report: null, pending: null };
    return appState.score;
  }
  function scoreText(id, value) { var el = document.getElementById(id); if (el) { el.textContent = value; if (el.setAttribute) el.setAttribute('data-loading', value === 'Sedang memuat data' ? 'true' : 'false'); } }
  function scoreMessage(message) { scoreText('scoreMessage', message || ''); }
  function scoreBusy(busy) {
    ['scoreSales', 'scoreMonth', 'scoreAADate', 'scoreAACount'].forEach(function(id) {
      var el = document.getElementById(id); if (el) el.disabled = busy;
    });
    var pending = scoreState().pending;
    ['scoreAASave'].forEach(function(id) { var el = document.getElementById(id); if (el) el.disabled = busy && (!pending || pending.button !== id); });
  }
  function openScore() {
    var state = scoreState();
    if (state.pending) { scoreMessage('Ada kiriman yang perlu dipastikan. Tekan Periksa / ulangi simpan.'); return; }
    var seq = ++state.setupSeq;
    ++state.seq; state.report = null; state.setup = null;
    scoreText('scoreTotal', 'Sedang memuat data'); scoreText('scoreCategory', 'Sedang memuat data');
    setHtml('scoreRows', '<tr><td colspan="7"><span class="widget-loading">Sedang memuat data</span></td></tr>'); setHtml('scoreDailyRows', '<tr><td colspan="4"><span class="widget-loading">Sedang memuat data</span></td></tr>');
    document.getElementById('scoreAdminAA').hidden = true;
    document.getElementById('scoreMapping').hidden = true;
    scoreBusy(true); scoreMessage('Sedang memuat data');
    kchRun().withSuccessHandler(function(res) {
      if (seq !== scoreState().setupSeq) return;
      if (!res || !res.success) { scoreBusy(false); scoreText('scoreTotal', '—'); scoreText('scoreCategory', 'Gagal memuat'); scoreMessage(res && res.message || 'Gagal memuat Skor.'); return; }
      state.setup = res;
      var select = document.getElementById('scoreSales'), previous = select.value;
      select.innerHTML = res.sales.map(function(s) { return '<option value="' + escapeHtml(s.salesId) + '">' + escapeHtml(s.name + ' · ' + s.team + (s.active ? '' : ' (nonaktif)')) + '</option>'; }).join('');
      if (res.sales.some(function(s) { return s.salesId === previous; })) select.value = previous;
      var month = document.getElementById('scoreMonth'); if (!month.value) month.value = res.today.slice(0, 7);
      document.getElementById('scoreAdminAA').hidden = !res.canManage;
      document.getElementById('scoreMapping').hidden = !res.canManage;
      renderScoreMapping(); scoreBusy(false);
      if (!res.sales.length) { scoreMessage('Skor hanya tersedia untuk Motoris dan MMTW. Tidak ada profil yang dapat ditampilkan.'); scoreText('scoreTotal', '—'); scoreText('scoreCategory', 'Tidak tersedia'); return; }
      loadScoreReport();
    }).withFailureHandler(function(err) {
      if (seq !== scoreState().setupSeq) return;
      scoreBusy(false); scoreText('scoreTotal', '—'); scoreText('scoreCategory', 'Gagal memuat'); scoreMessage(err.message || 'Gagal memuat Skor.');
    }).getScoreSetup();
  }
  function renderScoreMapping() {
    var setup = scoreState().setup; if (!setup || !setup.canManage) return;
    var groups = { FOCUS_A: 'Fokus A', FOCUS_B: 'Fokus B', EXCLUDE: 'Promag tablet · dikecualikan', OTHER: 'Omzet saja' };
    document.getElementById('scoreMapRows').innerHTML = setup.products.map(function(p) {
      return '<tr><td>' + escapeHtml(p.productId) + '</td><td>' + escapeHtml(p.productName) + '</td><td>' + groups[p.group] + '</td></tr>';
    }).join('');
    scoreText('scoreMappingIssues', setup.mappingIssues.join('; ') || 'Kode dan nama master cocok dengan pemetaan yang disepakati.');
  }

  function loadScoreReport() {
    var state = scoreState(); if (!state.setup || state.pending) return;
    var month = document.getElementById('scoreMonth').value, salesId = document.getElementById('scoreSales').value;
    var seq = ++state.seq; state.report = null;
    scoreText('scoreTotal', 'Sedang memuat data'); scoreText('scoreCategory', 'Sedang memuat data'); scoreText('scoreCalendar', '');
    setHtml('scoreRows', '<tr><td colspan="7"><span class="widget-loading">Sedang memuat data</span></td></tr>'); setHtml('scoreDailyRows', '<tr><td colspan="4"><span class="widget-loading">Sedang memuat data</span></td></tr>'); scoreText('scoreAASummary', '');
    document.getElementById('scoreAASave').disabled = true; document.getElementById('scoreAACount').value = '';
    if (!month || !salesId) { scoreText('scoreTotal', '—'); scoreText('scoreCategory', 'Pilih periode penilaian'); scoreMessage('Pilih sales dan bulan.'); return; }
    scoreMessage('Sedang memuat data');
    kchRun().withSuccessHandler(function(res) {
      if (seq !== scoreState().seq) return;
      if (!res || !res.success) { scoreText('scoreTotal', '—'); scoreText('scoreCategory', 'Gagal memuat'); scoreMessage(res && res.message || 'Skor gagal dimuat.'); return; }
      state.report = res; scoreMessage(res.message);
      scoreText('scoreTotal', res.total === null ? '—' : res.total.toLocaleString('id-ID', { maximumFractionDigits: 0 }) + ' / 100');
      scoreText('scoreCategory', res.category ? res.category + ' · ' + res.nextMonth : 'Pemetaan master perlu diperiksa');
      scoreText('scoreCalendar', res.workDaysPassed + ' dari ' + res.workDays + ' hari kerja · Minggu dikecualikan; libur mengikuti ' + (res.holidaySource || 'sheet HOLIDAYS yang belum tersedia') + '. Target tetap sebulan penuh.');
      document.getElementById('scoreRows').innerHTML = res.parameters.map(function(p, i) {
        return '<tr><td>' + escapeHtml(p.name) + '</td><td>' + (i === 3 ? p.actual.toLocaleString('id-ID') : formatRupiah(p.actual)) + '</td><td>' + (i === 3 ? p.target : formatRupiah(p.target)) + '</td><td>' + (p.weight * 100) + '%</td><td>' + (p.achievement * 100).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + '%</td><td>' + p.points.toLocaleString('id-ID', { maximumFractionDigits: 2 }) + '</td><td>' + p.score.toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' / ' + p.max + '</td></tr>';
      }).join('');
      scoreText('scoreAASummary', 'AA: ' + res.totalAA.toLocaleString('id-ID') + ' / 400 · ' + res.enteredDays + ' hari sudah diinput. Tanda — berarti belum diinput, bukan angka nol.');
      document.getElementById('scoreDailyRows').innerHTML = res.dailyAA.map(function(d) {
        return '<tr><td>' + escapeHtml(d.date) + '</td><td>' + (d.isWorkDay ? 'Hari kerja' : 'Minggu / libur') + '</td><td>' + (d.count === null ? '—' : d.count.toLocaleString('id-ID')) + '</td>' + (state.setup.canManage ? '<td>' + escapeHtml(d.actor || '—') + '<br><small>' + escapeHtml(d.updatedAt || '') + '</small></td>' : '') + '</tr>';
      }).join('');
      document.getElementById('scoreActorHeader').hidden = !state.setup.canManage;
      var input = document.getElementById('scoreAADate'), today = state.setup.today;
      input.min = res.dailyAA[0].date; input.max = res.dailyAA[res.dailyAA.length - 1].date < today ? res.dailyAA[res.dailyAA.length - 1].date : today;
      if (!input.value || input.value.slice(0, 7) !== month || input.value > input.max) input.value = today.slice(0, 7) === month ? today : res.dailyAA[0].date;
      selectScoreAADate();
    }).withFailureHandler(function(err) {
      if (seq !== scoreState().seq) return;
      scoreText('scoreTotal', '—'); scoreText('scoreCategory', 'Gagal memuat'); scoreMessage(err.message || 'Gagal memuat Skor.');
    }).getScoreReport(month, salesId);
  }
  function selectScoreAADate() {
    var state = scoreState(); if (!state.report || state.pending) return;
    var date = document.getElementById('scoreAADate').value;
    var day = state.report.dailyAA.filter(function(d) { return d.date === date; })[0];
    document.getElementById('scoreAACount').value = day && day.count !== null ? day.count : '';
    var sales = state.setup.sales.filter(function(s) { return s.salesId === state.report.sales.salesId; })[0];
    document.getElementById('scoreAASave').disabled = !state.setup.canManage || !sales || !sales.active || !day || date > state.setup.today;
  }
  function saveScoreAA() {
    var state = scoreState();
    if (state.pending) { if (state.pending.method === 'saveScoreAA') sendScoreSave(); return; }
    if (!state.report || !state.setup.canManage) return;
    var input = document.getElementById('scoreAACount'), text = input.value.trim(), date = document.getElementById('scoreAADate').value;
    if (!/^\d+$/.test(text) || !Number.isSafeInteger(Number(text))) { scoreMessage('Isi AA dengan bilangan bulat minimal 0.'); return; }
    var day = state.report.dailyAA.filter(function(d) { return d.date === date; })[0];
    if (!day || date > state.setup.today) { scoreMessage('Pilih tanggal dalam periode yang tidak melebihi hari ini.'); return; }
    state.pending = { method: 'saveScoreAA', button: 'scoreAASave', payload: { requestId: 'SCORE-' + crypto.randomUUID(), expectedRevision: day.revision, salesId: state.report.sales.salesId, date: date, count: Number(text) } };
    sendScoreSave();
  }
  function sendScoreSave() {
    var state = scoreState(), pending = state.pending; if (!pending || pending.sending) return;
    pending.sending = true; scoreBusy(true);
    var button = document.getElementById(pending.button); button.disabled = true; button.textContent = 'Menyimpan…';
    scoreMessage('Menyimpan data…');
    function uncertain(message) {
      pending.sending = false; button.disabled = false; button.textContent = 'Periksa / ulangi simpan'; scoreMessage(message);
    }
    var runner = kchRun().withSuccessHandler(function(res) {
      if (!res || res.code === 'SAVE_UNCERTAIN') { uncertain(res && res.message || 'Hasil belum pasti. Periksa / ulangi simpan.'); return; }
      state.pending = null; button.textContent = 'Simpan AA'; scoreBusy(false);
      if (!res.success) { state.report = null; document.getElementById('scoreAASave').disabled = true; scoreMessage((res.message || 'Data gagal disimpan.') + ' Tekan Muat ulang sebelum menginput lagi.'); return; }
      showToast(res.message || 'Data Skor disimpan.', 'success'); openScore();
    }).withFailureHandler(function(err) { uncertain((err && err.message || 'Koneksi terputus.') + ' Periksa / ulangi simpan dengan kiriman yang sama.'); });
    runner[pending.method](pending.payload);
  }
</script>
