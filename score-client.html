<script>
  function scoreState() {
    if (!appState.score) appState.score = { seq: 0, setupSeq: 0, summarySeq: 0, summaryMonth: '', setup: null, report: null, pending: null };
    return appState.score;
  }
  function scoreText(id, value) { var el = document.getElementById(id); if (el) { el.textContent = value; if (el.setAttribute) el.setAttribute('data-loading', value === 'Sedang memuat data' ? 'true' : 'false'); } }
  function scoreMessage(message) { scoreText('scoreMessage', message || ''); }
  function scoreBusy(busy) {
    ['scoreSales', 'scoreMonth', 'scoreAADate', 'scoreAACount', 'scoreBrandingDate', 'scoreBrandingCount'].forEach(function(id) {
      var el = document.getElementById(id); if (el) el.disabled = busy;
    });
    var pending = scoreState().pending;
    ['scoreAASave', 'scoreBrandingSave'].forEach(function(id) { var el = document.getElementById(id); if (el) el.disabled = busy && (!pending || pending.button !== id); });
  }
  function openScore() {
    var state = scoreState();
    if (state.pending) { scoreMessage('Ada kiriman yang perlu dipastikan. Tekan Periksa / ulangi simpan.'); return; }
    state.summarySeq = (state.summarySeq || 0) + 1; state.summaryMonth = '';
    scoreSummaryStatus('Sedang memuat data', true);
    var seq = ++state.setupSeq;
    ++state.seq; state.report = null; state.setup = null;
    scoreText('scoreTotal', 'Sedang memuat data'); scoreText('scoreCategory', 'Sedang memuat data');scoreText('scoreEvaluationRule','');scoreText('scoreEvaluationStatus','');
    setHtml('scoreRows', '<tr><td colspan="7"><span class="widget-loading">Sedang memuat data</span></td></tr>'); setHtml('scoreDailyRows', '<tr><td colspan="4"><span class="widget-loading">Sedang memuat data</span></td></tr>');
    document.getElementById('scoreBrandingCard').hidden = true;
    document.getElementById('scoreAdminAA').hidden = true;
    document.getElementById('scoreMapping').hidden = true;
    scoreBusy(true); scoreMessage('Sedang memuat data');
    kchRun().withSuccessHandler(function(res) {
      if (seq !== scoreState().setupSeq) return;
      if (!res || !res.success) { scoreBusy(false); scoreText('scoreTotal', '—'); scoreText('scoreCategory', 'Gagal memuat'); scoreMessage(res && res.message || 'Gagal memuat Skor.'); scoreSummaryStatus('Rekap belum dapat dimuat. Tekan Muat ulang.'); return; }
      state.setup = res;
      var select = document.getElementById('scoreSales'), previous = select.value;
      select.innerHTML = res.sales.map(function(s) { return '<option value="' + escapeHtml(s.salesId) + '">' + escapeHtml(s.name + ' · ' + s.team + (s.active ? '' : ' (nonaktif)')) + '</option>'; }).join('');
      if (res.sales.some(function(s) { return s.salesId === previous; })) select.value = previous;
      var month = document.getElementById('scoreMonth'); if (!month.value) month.value = res.today.slice(0, 7);
      document.getElementById('scoreAdminAA').hidden = !res.canManage;
      document.getElementById('scoreMapping').hidden = !res.canManage;
      renderScoreMapping(); scoreBusy(false);
      if (!res.sales.length) { scoreMessage('Skor hanya tersedia untuk Motoris, MMTW, MPR dan Canvasser. Tidak ada profil yang dapat ditampilkan.'); scoreText('scoreTotal', '—'); scoreText('scoreCategory', 'Tidak tersedia'); scoreSummaryStatus('Belum ada profil sales yang masuk penilaian.'); return; }
      loadScoreReport();
    }).withFailureHandler(function(err) {
      if (seq !== scoreState().setupSeq) return;
      scoreBusy(false); scoreText('scoreTotal', '—'); scoreText('scoreCategory', 'Gagal memuat'); scoreMessage(err.message || 'Gagal memuat Skor.'); scoreSummaryStatus('Rekap belum dapat dimuat. Tekan Muat ulang.');
    }).getScoreSetup(document.getElementById('scoreMonth').value||undefined);
  }
  function renderScoreMapping() {
    var setup = scoreState().setup; if (!setup || !setup.canManage) return;
    var groups = { FOCUS_A: 'Fokus A', FOCUS_B: 'Fokus B', EXCLUDE: 'Promag tablet · dikecualikan', OTHER: 'Omzet saja' };
    document.getElementById('scoreMapRows').innerHTML = setup.products.map(function(p) {
      return '<tr><td>' + escapeHtml(p.productId) + '</td><td>' + escapeHtml(p.productName) + '</td><td>' + groups[p.group] + '</td></tr>';
    }).join('');
    scoreText('scoreMappingIssues', setup.mappingIssues.join('; ') || 'Kode dan nama master cocok dengan pemetaan yang disepakati.');
  }

  function scoreSummaryStatus(message, loading) {
    setHtml('scoreSummaryRows', '<tr><td colspan="9" class="text-muted">' + (loading ? '<span class="widget-loading">' : '<span>') + escapeHtml(message) + '</span></td></tr>');
  }
  function scoreGuidanceText(note) {
    if (note.remaining === 0) return note.label + ': target tercapai — skor maksimal.';
    if (note.count) return note.label + ': Masih kurang ' + Number(note.remaining).toLocaleString('id-ID') + ' outlet lagi untuk skor maksimal.';
    var text = note.label + ': Masih kurang ' + formatRupiah(note.remaining) + '.';
    if (note.alternatives && note.alternatives.length) {
      text += '\n' + note.alternatives.map(function(q) {
        var unit = q.unit.charAt(0).toUpperCase() + q.unit.slice(1);
        return q.quantity.toLocaleString('id-ID') + ' ' + unit + ' ' + (q.displayName || q.productName) + ' (acuan ' + formatRupiah(q.unitPrice) + '/' + q.unit + ')';
      }).join(', atau\n') + ' untuk skor maksimal.';
    }
    if (note.label === 'Fokus B' && note.alternatives && note.alternatives.length) text += '\nKomix Herbal Family dan Promag Herbal bisa dikombinasikan.';
    if (note.warnings && note.warnings.length) text += '\n' + note.warnings.join(' ');
    return text;
  }
  function scoreDisplayTotal(value,month,legacyDigits){
    if(typeof value!=='number'||!Number.isFinite(value))return '—';
    var modern=month>='2026-11',digits=modern?2:legacyDigits||0,text=value.toLocaleString('id-ID',{maximumFractionDigits:digits}),rounded=Math.round(value*100)/100;
    if(modern&&(rounded===70||rounded===80)&&value!==rounded)text=(value<rounded?'< ':'> ')+text;
    return text;
  }
  function scoreEvaluationPhase(evaluation){if(!evaluation)return '';return !evaluation.verified?'Menunggu verifikasi':evaluation.phase==='FINAL'?'Final':evaluation.phase==='ESTIMASI'?'Estimasi':'Belum berjalan';}
  function renderScoreTeamSummary(res) {
    scoreText('scoreSummaryPeriod', 'Periode penilaian: ' + res.month + ' · ' + res.rows.length + ' sales');
    if (!res.rows.length) { scoreSummaryStatus('Belum ada profil sales yang masuk penilaian.'); return; }
    setHtml('scoreSummaryRows', res.rows.map(function(row) {
      var notes = row.message ? [row.message] : (row.guidance || []).map(scoreGuidanceText);
      function points(index) {
        var p = (row.parameters || [])[index];
        return !p || p.score===null ? '—' : (p.score===null?'—':p.score.toLocaleString('id-ID', { maximumFractionDigits: 2 })) + ' / ' + p.max;
      }
      return '<tr><td style="min-width:280px;max-width:440px;white-space:normal"><strong>' + escapeHtml(row.sales.name) + (row.active ? '' : ' (nonaktif)') + '</strong><ul style="padding-left:16px;margin-top:6px;font-size:12px;color:#64748b;line-height:1.6">' + notes.map(function(note) { return '<li>' + escapeHtml(note).replace(/\n/g, '<br>') + '</li>'; }).join('') + '</ul></td><td>' + escapeHtml(row.sales.team) + '</td><td>' + points(0) + '</td><td>' + points(1) + '</td><td>' + points(2) + '</td><td>' + points(3) + '</td><td>' + points(4) + '</td><td class="font-semibold">' + escapeHtml(scoreDisplayTotal(row.total,res.month,2)) + '</td><td>' + escapeHtml(row.evaluation&&row.evaluation.phase==='BELUM_BERJALAN'?'Periode belum berjalan':row.category || 'Belum dapat dihitung') + (row.evaluation?'<br><small>'+escapeHtml(scoreEvaluationPhase(row.evaluation))+'</small><p style="white-space:normal;min-width:200px">'+escapeHtml(row.evaluation.message)+'</p>':'') + '</td></tr>';
    }).join(''));
  }
  function loadScoreTeamSummary(month) {
    var state = scoreState();
    if (!/^20\d{2}-(0[1-9]|1[0-2])$/.test(month || '')) {
      state.summarySeq = (state.summarySeq || 0) + 1; state.summaryMonth = '';
      scoreText('scoreSummaryPeriod', ''); scoreSummaryStatus('Pilih bulan penilaian untuk melihat rekap.'); return;
    }
    if (state.summaryMonth === month) return;
    state.summaryMonth = month; var seq = state.summarySeq = (state.summarySeq || 0) + 1;
    scoreText('scoreSummaryPeriod', 'Periode penilaian: ' + month); scoreSummaryStatus('Sedang memuat data', true);
    kchRun().withSuccessHandler(function(res) {
      if (seq !== scoreState().summarySeq) return;
      try {
        if (!res || !res.success || res.month !== month || !Array.isArray(res.rows)) throw new Error(res && res.message || 'Respons rekap belum lengkap.');
        renderScoreTeamSummary(res);
      } catch (err) { state.summaryMonth = ''; scoreSummaryStatus('Rekap gagal ditampilkan. Tekan Muat ulang.'); }
    }).withFailureHandler(function(err) {
      if (seq !== scoreState().summarySeq) return;
      state.summaryMonth = ''; scoreSummaryStatus('Rekap gagal dimuat: ' + (err && err.message || 'Koneksi terputus') + ' Tekan Muat ulang.');
    }).getScoreTeamSummary(month);
  }

  // Handle omitted empty daily fields at the response boundary. Missing is not zero.
  function scoreNormalizeDaily(rows, label) {
    if (!Array.isArray(rows) || !rows.length) throw new Error('Rincian harian ' + label + ' belum lengkap. Muat ulang atau pastikan file Skor terbaru sudah terpasang.');
    return rows.map(function(row) {
      if (!row || typeof row.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(row.date)) throw new Error('Tanggal rincian ' + label + ' tidak valid.');
      var count = row.count;
      if (count === undefined || count === null || count === '') {
        if (row.revision) throw new Error('Angka ' + label + ' yang sudah tersimpan belum dapat dibaca. Muat ulang data.');
        count = null;
      } else if (typeof count !== 'number' || !Number.isSafeInteger(count) || count < 0) {
        throw new Error('Angka rincian ' + label + ' tidak valid.');
      }
      return Object.assign({}, row, { count: count, revision: row.revision || '' });
    });
  }
  function scoreReportFailure(message) {
    scoreState().report = null;
    scoreMessage(message || 'Gagal memuat rincian Skor. Tekan Muat ulang.');
    ['scoreRows', 'scoreDailyRows', 'scoreBrandingDailyRows'].forEach(function(id) {
      setHtml(id, '<tr><td colspan="7" class="text-muted">Data belum berhasil ditampilkan. Tekan Muat ulang.</td></tr>');
    });
    ['scoreAASave', 'scoreBrandingSave'].forEach(function(id) { var button = document.getElementById(id); if (button) button.disabled = true; });
  }
  function loadScoreReport() {
    var state = scoreState(); if (!state.setup || state.pending) return;
    var month = document.getElementById('scoreMonth').value, salesId = document.getElementById('scoreSales').value;
    loadScoreTeamSummary(month);
    var seq = ++state.seq; state.report = null;
    document.getElementById('scoreBrandingCard').hidden = true;
    document.getElementById('scoreBrandingSave').disabled = true;
    scoreText('scoreTotal', 'Sedang memuat data'); scoreText('scoreCategory', 'Sedang memuat data'); scoreText('scoreCalendar', '');scoreText('scoreEvaluationRule','');scoreText('scoreEvaluationStatus','');
    setHtml('scoreRows', '<tr><td colspan="7"><span class="widget-loading">Sedang memuat data</span></td></tr>'); setHtml('scoreDailyRows', '<tr><td colspan="4"><span class="widget-loading">Sedang memuat data</span></td></tr>'); scoreText('scoreAASummary', '');
    document.getElementById('scoreAASave').disabled = true; document.getElementById('scoreAACount').value = '';
    if (!month || !salesId) { scoreText('scoreTotal', '—'); scoreText('scoreCategory', 'Pilih periode penilaian'); scoreMessage('Pilih sales dan bulan.'); return; }
    scoreMessage('Sedang memuat data');
    kchRun().withSuccessHandler(function(res) {
      if (seq !== scoreState().seq) return;
      if (!res || !res.success) { scoreText('scoreTotal', '—'); scoreText('scoreCategory', 'Gagal memuat'); scoreReportFailure(res && res.message || 'Skor gagal dimuat.'); return; }
      try {
      res.dailyAA = scoreNormalizeDaily(res.dailyAA, 'AA');
      if (res.brandingEnabled) res.dailyBranding = scoreNormalizeDaily(res.dailyBranding, 'branding');
      state.report = res; scoreMessage(res.message);
      scoreText('scoreTotal', res.total === null ? '—' : scoreDisplayTotal(res.total,res.month,0) + ' / 100');
      scoreText('scoreEvaluationRule',res.evaluationRule?res.evaluationRule.text:'');scoreText('scoreEvaluationStatus',res.evaluation?res.evaluation.message:'');
      scoreText('scoreCategory',res.evaluation&&res.evaluation.phase==='BELUM_BERJALAN'?'Periode belum berjalan':res.category?res.category+' · '+res.nextMonth+(res.evaluation&&res.month>='2026-11'&&res.evaluation.phase!=='FINAL'?' · '+scoreEvaluationPhase(res.evaluation):''):res.masterVerified===false?'Periode belum terverifikasi':res.evaluation&&!res.evaluation.verified?'Evaluasi belum dapat dipastikan':'Pemetaan master perlu diperiksa');
      scoreText('scoreCalendar', res.workDaysPassed + ' dari ' + res.workDays + ' hari kerja · Minggu dikecualikan; libur mengikuti ' + (res.holidaySource || 'sheet HOLIDAYS yang belum tersedia') + '. Target tetap sebulan penuh.');
      document.getElementById('scoreRows').innerHTML = res.parameters.map(function(p, i) {
        return '<tr><td>' + escapeHtml(p.name) + '</td><td>' + (i >= 3 ? p.actual.toLocaleString('id-ID') : formatRupiah(p.actual)) + '</td><td>' + (p.target===null?'—':i >= 3 ? p.target : formatRupiah(p.target)) + '</td><td>' + (p.weight * 100) + '%</td><td>' + (p.achievement===null?'—':(p.achievement * 100).toLocaleString('id-ID', { maximumFractionDigits: 2 })+'%') + '</td><td>' + (p.points===null?'—':p.points.toLocaleString('id-ID', { maximumFractionDigits: 2 })) + '</td><td>' + (p.score===null?'—':p.score.toLocaleString('id-ID', { maximumFractionDigits: 2 })) + ' / ' + p.max + '</td></tr>';
      }).join('');
      scoreText('scoreAASummary', 'AA: ' + res.totalAA.toLocaleString('id-ID') + ' / 400 · ' + res.enteredDays + ' hari sudah diinput. Tanda — berarti belum diinput, bukan angka nol.');
      document.getElementById('scoreDailyRows').innerHTML = res.dailyAA.map(function(d) {
        return '<tr><td>' + escapeHtml(d.date) + '</td><td>' + (d.isWorkDay ? 'Hari kerja' : 'Minggu / libur') + '</td><td>' + (d.count === null ? '—' : d.count.toLocaleString('id-ID')) + '</td>' + (state.setup.canManage ? '<td>' + escapeHtml(d.actor || '—') + '<br><small>' + escapeHtml(d.updatedAt || '') + '</small></td>' : '') + '</tr>';
      }).join('');
      document.getElementById('scoreActorHeader').hidden = !state.setup.canManage;
      var input = document.getElementById('scoreAADate'), today = state.setup.today;
      input.min = res.dailyAA[0].date; input.max = res.dailyAA[res.dailyAA.length - 1].date < today ? res.dailyAA[res.dailyAA.length - 1].date : today;
      if (!input.value || input.value.slice(0, 7) !== month || input.value > input.max) input.value = today.slice(0, 7) === month ? today : res.dailyAA[0].date;
      selectScoreAADate();
      renderScoreBranding(res);
      } catch (err) {
        scoreText('scoreTotal', '—'); scoreText('scoreCategory', 'Gagal menampilkan data');
        scoreReportFailure(/^(Rincian|Tanggal|Angka)/.test(err.message || '') ? err.message : 'Gagal menampilkan rincian Skor. Tekan Muat ulang dan pastikan file HTML Skor terbaru sudah terpasang.');
      }
    }).withFailureHandler(function(err) {
      if (seq !== scoreState().seq) return;
      scoreText('scoreTotal', '—'); scoreText('scoreCategory', 'Gagal memuat'); scoreReportFailure(err.message || 'Gagal memuat Skor.');
    }).getScoreReport(month, salesId);
  }
  function selectScoreAADate() {
    var state = scoreState(); if (!state.report || state.pending) return;
    var date = document.getElementById('scoreAADate').value;
    var day = state.report.dailyAA.filter(function(d) { return d.date === date; })[0];
    document.getElementById('scoreAACount').value = day && day.count !== null ? day.count : '';
    var sales = state.setup.sales.filter(function(s) { return s.salesId === state.report.sales.salesId; })[0];
    document.getElementById('scoreAASave').disabled = !state.setup.canManage || !sales || !sales.active || !day || date > state.setup.today;
  }
  function saveScoreAA() {
    var state = scoreState();
    if (state.pending) { if (state.pending.method === 'saveScoreAA') sendScoreSave(); return; }
    if (!state.report || !state.setup.canManage) return;
    var input = document.getElementById('scoreAACount'), text = input.value.trim(), date = document.getElementById('scoreAADate').value;
    if (!/^\d+$/.test(text) || !Number.isSafeInteger(Number(text))) { scoreMessage('Isi AA dengan bilangan bulat minimal 0.'); return; }
    var day = state.report.dailyAA.filter(function(d) { return d.date === date; })[0];
    if (!day || date > state.setup.today) { scoreMessage('Pilih tanggal dalam periode yang tidak melebihi hari ini.'); return; }
    state.pending = { method: 'saveScoreAA', button: 'scoreAASave', payload: { requestId: 'SCORE-' + crypto.randomUUID(), expectedRevision: day.revision, salesId: state.report.sales.salesId, date: date, count: Number(text) } };
    sendScoreSave();
  }
  function renderScoreBranding(res) {
    var state = scoreState();
    document.getElementById('scoreBrandingCard').hidden = !res.brandingEnabled;
    document.getElementById('scoreAdminBranding').hidden = !state.setup.canManage || !res.brandingEnabled;
    if (!res.brandingEnabled) return;
    scoreText('scoreBrandingSummary', 'Branding: ' + res.totalBranding.toLocaleString('id-ID') + ' / 300 · ' + res.brandingEnteredDays + ' hari sudah diinput. Tanda — berarti belum diinput.');
    document.getElementById('scoreBrandingDailyRows').innerHTML = res.dailyBranding.map(function(d) {
      return '<tr><td>' + escapeHtml(d.date) + '</td><td>' + (d.isWorkDay ? 'Hari kerja' : 'Minggu / libur') + '</td><td>' + (d.count === null ? '—' : d.count.toLocaleString('id-ID')) + '</td>' + (state.setup.canManage ? '<td>' + escapeHtml(d.actor || '—') + '<br><small>' + escapeHtml(d.updatedAt || '') + '</small></td>' : '') + '</tr>';
    }).join('');
    document.getElementById('scoreBrandingActorHeader').hidden = !state.setup.canManage;
    var input = document.getElementById('scoreBrandingDate'), today = state.setup.today;
    input.min = res.dailyBranding[0].date; input.max = res.dailyBranding[res.dailyBranding.length - 1].date < today ? res.dailyBranding[res.dailyBranding.length - 1].date : today;
    if (!input.value || input.value.slice(0, 7) !== res.month || input.value > input.max) input.value = today.slice(0, 7) === res.month ? today : res.dailyBranding[0].date;
    selectScoreBrandingDate();
  }
  function selectScoreBrandingDate() {
    var state = scoreState(); if (!state.report || !state.report.brandingEnabled || state.pending) return;
    var date = document.getElementById('scoreBrandingDate').value;
    var day = state.report.dailyBranding.filter(function(d) { return d.date === date; })[0];
    document.getElementById('scoreBrandingCount').value = day && day.count !== null ? day.count : '';
    var sales = state.setup.sales.filter(function(s) { return s.salesId === state.report.sales.salesId; })[0];
    document.getElementById('scoreBrandingSave').disabled = !state.setup.canManage || !sales || !sales.active || !day || date > state.setup.today;
  }
  function saveScoreBranding() {
    var state = scoreState();
    if (state.pending) { if (state.pending.method === 'saveScoreBranding') sendScoreSave(); return; }
    if (!state.report || !state.report.brandingEnabled || !state.setup.canManage) return;
    var text = document.getElementById('scoreBrandingCount').value.trim(), date = document.getElementById('scoreBrandingDate').value;
    if (!/^\d+$/.test(text) || !Number.isSafeInteger(Number(text))) { scoreMessage('Isi branding dengan bilangan bulat minimal 0.'); return; }
    var day = state.report.dailyBranding.filter(function(d) { return d.date === date; })[0];
    if (!day || date > state.setup.today) { scoreMessage('Pilih tanggal dalam periode yang tidak melebihi hari ini.'); return; }
    state.pending = { method: 'saveScoreBranding', button: 'scoreBrandingSave', payload: { requestId: 'SCORE-' + crypto.randomUUID(), expectedRevision: day.revision, salesId: state.report.sales.salesId, date: date, count: Number(text) } };
    sendScoreSave();
  }
  function sendScoreSave() {
    var state = scoreState(), pending = state.pending; if (!pending || pending.sending) return;
    pending.sending = true; scoreBusy(true);
    var button = document.getElementById(pending.button); button.disabled = true; button.textContent = 'Menyimpan…';
    scoreMessage('Menyimpan data…');
    function uncertain(message) {
      pending.sending = false; button.disabled = false; button.textContent = 'Periksa / ulangi simpan'; scoreMessage(message);
    }
    var runner = kchRun().withSuccessHandler(function(res) {
      if (!res || res.code === 'SAVE_UNCERTAIN') { uncertain(res && res.message || 'Hasil belum pasti. Periksa / ulangi simpan.'); return; }
      state.pending = null; button.textContent = pending.method === 'saveScoreBranding' ? 'Simpan branding' : 'Simpan AA'; scoreBusy(false);
      if (!res.success) { state.report = null; document.getElementById('scoreAASave').disabled = true; document.getElementById('scoreBrandingSave').disabled = true; scoreMessage((res.message || 'Data gagal disimpan.') + ' Tekan Muat ulang sebelum menginput lagi.'); return; }
      showToast(res.message || 'Data Skor disimpan.', 'success'); openScore();
    }).withFailureHandler(function(err) { uncertain((err && err.message || 'Koneksi terputus.') + ' Periksa / ulangi simpan dengan kiriman yang sama.'); });
    runner[pending.method](pending.payload);
  }
</script>
