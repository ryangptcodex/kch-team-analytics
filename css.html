<style>
  body.kch-readonly [data-kch-write] { display: none !important; }
  .kch-news-banner:has(.widget-loading) { background: #f1f5f9; }
  .kpi-card:has([data-loading="true"]) { min-width: 0; }
  .kpi-value-wrap:has([data-loading="true"]) { flex-wrap: wrap; gap: 6px; }
  .widget-loading, [data-loading="true"] {
    color: var(--text-muted) !important;
    font-size: 12px !important;
    font-weight: 400 !important;
    line-height: 1.5 !important;
    letter-spacing: normal !important;
    white-space: normal !important;
    overflow-wrap: anywhere;
  }
  .badge[data-loading="true"], .live-badge[data-loading="true"], .live-badge:has(.widget-loading) { background: #f1f5f9; color: var(--text-muted); }
  .chart-canvas-container[data-chart-state="loading"] canvas, .chart-canvas-container[data-chart-state="error"] canvas { visibility: hidden; max-width: 100%; }
  .chart-canvas-container[data-chart-state="loading"], .chart-canvas-container[data-chart-state="error"] { position: relative; }
  .chart-canvas-container[data-chart-state="loading"]::after, .chart-canvas-container[data-chart-state="error"]::after {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--text-muted); font-size: 12px; font-weight: 400;
    content: 'Sedang memuat data';
  }
  .chart-canvas-container[data-chart-state="error"]::after { content: 'Gagal memuat data'; }

  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-light: #eff6ff;
    --primary-border: #bfdbfe;
    
    --success: #16a34a;
    --success-light: #dcfce7;
    --warning: #f59e0b;
    --warning-light: #fef3c7;
    --danger: #ef4444;
    --danger-light: #fee2e2;

    --bg-main: #f8fafc;
    --bg-card: #ffffff;
    --sidebar-bg: #0c1e33;
    --sidebar-text: #94a3b8;
    --sidebar-hover: #162a45;
    
    --text-heading: #0f172a;
    --text-body: #334155;
    --text-muted: #64748b;
    
    --border-color: #e2e8f0;
    --card-border: #edf2f7;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.04);
    --shadow-card: 0 1px 3px rgba(16, 24, 40, 0.06), 0 1px 2px rgba(16, 24, 40, 0.04);
    --shadow-card-hover: 0 8px 16px -2px rgba(16, 24, 40, 0.08), 0 2px 4px -2px rgba(16, 24, 40, 0.04);

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-xl: 18px;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--bg-main);
    color: var(--text-body);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .app-layout {
    display: flex;
    align-items: stretch;
    min-height: 100vh;
    width: 100%;
  }

  .sidebar {
    width: 255px;
    background-color: var(--sidebar-bg);
    color: #f8fafc;
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    flex: 0 0 255px;
    height: 100vh;
    min-height: 0;
    z-index: 100;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .app-layout.sidebar-collapsed .sidebar {
    transform: translateX(-100%);
  }

  .sidebar-header {
    height: 68px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Badge Wadah Logo Kalbe: Background putih bersih agar siluet hijau Kalbe tampil kontras & elegan */
  .brand-logo-icon {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    background-color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
    flex-shrink: 0;
    padding: 3px;
  }

  /* Vektor SVG Logo Kalbe (Figur Heliks Ganda Hijau) */
  .kalbe-logo-svg {
    width: 24px;
    height: 28px;
    display: block;
  }

  .brand-title {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: #ffffff;
    display: block;
    line-height: 1.2;
  }

  .brand-subtitle {
    font-size: 11px;
    font-weight: 500;
    color: #94a3b8;
    display: block;
  }

  .btn-sidebar-close {
    background: transparent;
    border: none;
    color: #94a3b8;
    font-size: 18px;
    cursor: pointer;
    display: none;
  }

  .sidebar-nav {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .sidebar-nav::-webkit-scrollbar {
    display: none;
  }

  .nav-section-label {
    font-size: 10px;
    font-weight: 700;
    color: #64748b;
    letter-spacing: 0.8px;
    padding: 14px 12px 6px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 8px;
    color: var(--sidebar-text);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s ease;
    cursor: pointer;
  }

  .nav-item:hover {
    background-color: var(--sidebar-hover);
    color: #ffffff;
  }

  .nav-item.active {
    background-color: var(--primary);
    color: #ffffff;
    font-weight: 600;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
  }

  .nav-icon {
    font-size: 15px;
    width: 20px;
    text-align: center;
  }

  .sidebar-footer {
    padding: 16px 14px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .quote-card {
    background: linear-gradient(135deg, rgba(37, 99, 235, 0.12), rgba(56, 189, 248, 0.08));
    border: 1px solid rgba(56, 189, 248, 0.2);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
  }

  .quote-icon {
    font-size: 13px;
    color: #38bdf8;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .quote-text-wrap {
    flex: 1;
    min-width: 0;
  }

  .quote-text {
    font-size: 11px;
    font-weight: 600;
    font-style: italic;
    color: #e2e8f0;
    line-height: 1.4;
    letter-spacing: 0.1px;
  }

  .version-tag {
    font-size: 10px;
    color: #64748b;
    text-align: center;
    line-height: 1.4;
  }

  .main-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    margin-left: 255px;
    transition: margin-left 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .app-layout.sidebar-collapsed .main-wrapper {
    margin-left: 0;
  }

  .topbar {
    height: 68px;
    background-color: #ffffff;
    border-bottom: 1px solid var(--border-color);
    padding: 0 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .btn-sidebar-toggle {
    display: none;
    background: transparent;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    width: 36px;
    height: 36px;
    font-size: 16px;
    color: var(--text-body);
    cursor: pointer;
    align-items: center;
    justify-content: center;
  }

  .header-greeting {
    font-size: 17px;
    font-weight: 700;
    color: var(--text-heading);
    line-height: 1.2;
  }

  .wave-emoji {
    display: inline-block;
    animation: wave 2s infinite;
    transform-origin: 70% 70%;
  }

  @keyframes wave {
    0%, 100% { transform: rotate(0deg); }
    20%, 60% { transform: rotate(14deg); }
    40%, 80% { transform: rotate(-14deg); }
  }

  .header-subtitle-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 2px;
  }

  .header-subtitle {
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background-color: #ecfdf5;
    color: #059669;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 20px;
    border: 1px solid #a7f3d0;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    background-color: #10b981;
    border-radius: 50%;
    animation: pulse 1.6s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.95); opacity: 0.8; }
    50% { transform: scale(1.3); opacity: 1; }
    100% { transform: scale(0.95); opacity: 0.8; }
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .period-control-group {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }

  .btn-cal-standalone {
    width: 36px;
    height: 36px;
    background-color: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #475569;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    transition: all 0.15s ease;
  }

  .btn-cal-standalone:hover {
    border-color: #cbd5e1;
    background-color: #f8fafc;
    color: #0f172a;
  }

  .segmented-control-modern {
    background-color: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 3px 4px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
  }

  .seg-btn-modern {
    border: none;
    background: transparent;
    padding: 6px 14px;
    font-size: 12.5px;
    font-weight: 500;
    color: #475569;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    line-height: 1.4;
  }

  .seg-btn-modern:hover:not(.active) {
    color: #0f172a;
    background-color: #f8fafc;
  }

  .seg-btn-modern.active {
    background-color: #2563eb;
    color: #ffffff;
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(37, 99, 235, 0.2);
  }

  .seg-btn-custom {
    gap: 6px;
  }

  .seg-custom-chevron {
    font-size: 9.5px;
    color: #64748b;
    transition: transform 0.2s ease;
  }

  .seg-btn-modern.active .seg-custom-chevron {
    color: #ffffff;
  }

  .date-display-card {
    height: 36px;
    background-color: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 0 16px 0 14px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    transition: all 0.15s ease;
    min-width: 125px;
  }

  .date-display-card:hover {
    border-color: #cbd5e1;
    background-color: #f8fafc;
  }

  .date-card-icon {
    font-size: 13.5px;
    color: #64748b;
  }

  .date-card-text {
    font-size: 12.5px;
    font-weight: 600;
    color: #334155;
    letter-spacing: -0.1px;
    white-space: nowrap;
  }

  .date-badge-wrapper {
    position: relative;
  }

  .custom-period-dropdown {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background-color: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 16px;
    width: 260px;
    box-shadow: var(--shadow-card-hover);
    z-index: 60;
    animation: popIn 0.15s ease;
  }

  @keyframes popIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .popover-title {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-heading);
    margin-bottom: 12px;
  }

  .form-label-xs {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    display: block;
    margin-bottom: 4px;
  }

  .user-profile-wrapper {
    position: relative;
    flex-shrink: 0;
    max-width: 100%;
  }

  .user-profile-badge {
    max-width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 10px 5px 6px;
    border-radius: 30px;
    background-color: #ffffff;
    border: 1px solid #e2e8f0;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .user-profile-badge:hover {
    background-color: #f8fafc;
    border-color: #cbd5e1;
  }

  .user-avatar-circle {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1e293b, #475569);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
  }

  .user-meta-header {
    min-width: 0;
    max-width: 260px;
    display: flex;
    flex-direction: column;
    text-align: left;
    line-height: 1.2;
  }

  .user-name-header {
    white-space: normal;
    overflow-wrap: anywhere;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-heading);
  }

  .user-role-header {
    font-size: 10px;
    color: var(--text-muted);
  }

  .user-chevron {
    font-size: 10px;
    color: var(--text-muted);
  }

  .user-dropdown-menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 220px;
    background-color: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-card-hover);
    padding: 8px 0;
    z-index: 60;
    animation: popIn 0.15s ease;
  }

  .user-menu-info {
    padding: 10px 16px;
  }

  .user-menu-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-heading);
  }

  .user-menu-email {
    font-size: 11px;
    color: var(--text-muted);
  }

  .dropdown-divider {
    border: none;
    border-top: 1px solid var(--border-color);
    margin: 6px 0;
  }

  .dropdown-menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 16px;
    color: var(--text-body);
    text-decoration: none;
    font-size: 12.5px;
    transition: background-color 0.15s ease;
    cursor: pointer;
  }

  .btn-sidebar-toggle-desktop {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--text-body);
    flex-shrink: 0;
  }

  .dropdown-menu-item:hover {
    background-color: #f8fafc;
    color: var(--text-heading);
  }

  .main-content {
    flex: 1;
    padding: 24px 28px 40px;
  }

  .content-view {
    display: none;
    animation: fadeIn 0.2s ease;
  }

  .content-view.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .page-title-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }

  .page-title {
    font-size: 19px;
    font-weight: 700;
    color: var(--text-heading);
  }

  .page-subtitle {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }

  .kpi-card {
    background-color: #ffffff;
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    padding: 16px 16px;
    box-shadow: var(--shadow-sm);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-width: 0;
  }

  .kpi-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-card-hover);
  }

  .kpi-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .kpi-label {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.4px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .kpi-icon-pill {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }

  .icon-sales { background-color: #eff6ff; color: #2563eb; }
  .icon-target { background-color: #f5f3ff; color: #7c3aed; }
  .icon-days { background-color: #fef3c7; color: #d97706; }
  .icon-canvasser { background-color: #eff6ff; color: #1d4ed8; }
  .icon-motoris { background-color: #ecfdf5; color: #059669; }

  .kpi-value-wrap {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  .kpi-value {
    font-size: 17.5px;
    font-weight: 800;
    color: var(--text-heading);
    letter-spacing: -0.3px;
    white-space: nowrap;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.2;
    white-space: nowrap;
  }

  .badge-success { background-color: var(--success-light); color: var(--success); }
  .badge-warning { background-color: var(--warning-light); color: var(--warning); }
  .badge-danger { background-color: var(--danger-light); color: var(--danger); }
  .badge-primary { background-color: var(--primary-light); color: var(--primary); }
  .badge-neutral { background-color: #f1f5f9; color: #475569; }

  /* Badges Kategori Tim Berwarna */
  .badge-team-senior {
    background-color: #eff6ff;
    color: #1d4ed8;
    border: 1px solid #bfdbfe;
  }

  .badge-team-junior {
    background-color: #f0f9ff;
    color: #0284c7;
    border: 1px solid #bae6fd;
  }

  .badge-team-motoris {
    background-color: #ecfdf5;
    color: #15803d;
    border: 1px solid #a7f3d0;
  }

  .badge-team-ultimate {
    background-color: #f5f3ff;
    color: #6d28d9;
    border: 1px solid #ddd6fe;
  }

  .badge-team-spg {
    background-color: #fff7ed;
    color: #c2410c;
    border: 1px solid #fed7aa;
  }

  .kpi-progress-wrap {
    margin-top: 4px;
  }

  .progress-bar-bg {
    height: 6px;
    background-color: #f1f5f9;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 5px;
  }

  .progress-bar-fill {
    height: 100%;
    border-radius: 10px;
    transition: width 0.6s ease;
  }

  .fill-sales {
    background: linear-gradient(90deg, #3b82f6, #2563eb);
  }

  .kpi-footer-note {
    font-size: 10.5px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .top-performer-summary {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .top-performer-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-heading);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .top-performer-metric {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    flex-wrap: wrap;
  }

  .dashboard-main-grid {
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
    gap: 18px;
    margin-bottom: 24px;
    align-items: start;
  }

  .dashboard-left-col,
  .dashboard-side-col {
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-width: 0;
  }

  .chart-card {
    background-color: #ffffff;
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: var(--shadow-sm);
  }

  .kch-news-card .card-header-clean {
    margin-bottom: 12px;
  }

  .kch-news-banner {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
