<script>
  var operationLabels={STOCK_IN:'Stok masuk',STOCK_COUNT:'Stock opname',RETURN_HELD:'Retur pegangan',SALE_RETURN:'Retur penjualan',INVOICE_VOID:'Pembatalan faktur',PICKUP_CORRECT:'Koreksi pengambilan',DEPOSIT_CORRECT:'Koreksi setoran'};
  function auditUiState(){if(!appState.auditUi)appState.auditUi={seq:0,referenceSeq:0,masterSeq:0,healthSeq:0,page:1,data:null,reference:null,masters:null,restore:null};return appState.auditUi;}
  function auditAdmin(){if(!appState.user||appState.user.role!=='ADMIN'){showToast('Fitur ini khusus Admin.','error');return false;}return true;}
  function auditCanWrite(){if(!auditAdmin())return false;if(appState.pendingTransaction||appState.isSubmittingTransaction||appState.maintenanceBusy){showToast('Selesaikan atau periksa hasil kiriman sebelumnya terlebih dahulu.','error');return false;}return true;}
  function auditBeginRequest(payload){if(!auditCanWrite())return;try{payload.requestId=txClientNewId();appState.pendingTransaction={requestId:payload.requestId,payload:payload};txClientStore(appState.pendingTransaction);txClientSend(payload);}catch(err){if(!appState.isSubmittingTransaction)appState.pendingTransaction=null;showToast(err.message,'error');}}
  function auditSafeRunner(success,failure){var generation=kchAuthGeneration;return kchRun().withSuccessHandler(function(r){if(generation===kchAuthGeneration&&appState.user)success(r);}).withFailureHandler(function(err){if(generation===kchAuthGeneration&&appState.user)(failure||function(e){showToast(e.message||'Permintaan gagal.','error');})(err);});}
  function auditOptions(rows,key,label){return '<option value="">Pilih…</option>'+rows.map(function(r){return '<option value="'+escapeHtml(r[key])+'">'+escapeHtml(r[label]||r[key])+'</option>';}).join('');}
  function auditSetOptions(id,html){var old=getValue(id);setHtml(id,html);if(old)setValue(id,old);}
  function auditCheckResponse(r){if(!r||!r.success)throw new Error(r&&r.message||'Data belum berhasil dimuat.');return r;}
  function openOperations(page){
    if(!appState.user)return;var state=auditUiState(),seq=++state.seq;state.page=page||state.page||1;setText('operationsStatus','Memuat riwayat…');
    auditSafeRunner(function(r){try{auditCheckResponse(r);if(seq!==auditUiState().seq)return;state.data=r;
      auditSetOptions('operationSales',auditOptions(r.sales,'sales_id','full_name'));auditSetOptions('operationDistributor',auditOptions(r.distributors,'distributor_id','distributor_name'));
      if(!getValue('operationDate'))setValue('operationDate',getLocalDateInputValue());var date=document.getElementById('operationDate');if(date)date.max=getLocalDateInputValue();
      var wanted=getValue('operationKind'),source=wanted==='PICKUP_CORRECT'?'STOCK_PICKUPS':wanted==='DEPOSIT_CORRECT'?'SALES_CASH_DEPOSITS':'SALES_TRANSACTIONS';setHtml('operationReferenceOptions',(r.references||[]).filter(function(x){return x.type===source;}).map(function(x){return '<option value="'+escapeHtml(x.id)+'">'+escapeHtml(x.date+' · '+x.name)+'</option>';}).join(''));
      if(appState.user.role==='ADMIN'&&!state.operationFormInitialized){state.operationFormInitialized=true;operationKindChanged();}
      setHtml('operationsHistory',r.history.map(function(e){return '<tr><td>'+escapeHtml(e.date)+'<br><small>'+escapeHtml(e.id)+'</small></td><td>'+escapeHtml(operationLabels[e.kind]||e.kind)+'</td><td>'+escapeHtml(e.referenceId||'—')+'</td><td>'+e.lines.map(function(l){return escapeHtml(l.productName||l.productId)+' · '+escapeHtml(l.targetQty===undefined?l.qty:l.before+' → '+l.targetQty)+(l.condition==='DAMAGED'?' · Rusak':'');}).join('<br>')+'</td><td>'+formatRupiah(e.amount)+'</td><td>'+escapeHtml(e.reason)+'</td></tr>';}).join('')||'<tr><td colspan="6">Belum ada pencatatan operasional.</td></tr>');
      var products={},dists={};r.products.forEach(function(p){products[p.product_id]=p.product_name;});r.distributors.forEach(function(d){dists[d.distributor_id]=d.distributor_name;});
      setHtml('operationsDamaged',r.damaged.map(function(d){return '<tr><td>'+escapeHtml(products[d.product_id]||d.product_id)+'</td><td>'+escapeHtml(dists[d.distributor_id]||d.distributor_id)+'</td><td>'+Number(d.quantity).toLocaleString('id-ID')+'</td></tr>';}).join('')||'<tr><td colspan="3">Belum ada barang rusak.</td></tr>');
      setText('operationsPaging','Halaman '+r.page+' / '+Math.max(1,Math.ceil(r.total/50))+' · '+r.total+' catatan');document.getElementById('operationsPrev').disabled=r.page<=1;document.getElementById('operationsNext').disabled=r.page*50>=r.total;setText('operationsStatus','Riwayat tersimpan; nilai retur mengurangi pencapaian pada tanggal pencatatannya.');if(appState.pendingTransaction)txClientLock(true);
    }catch(err){setText('operationsStatus',err.message);}},function(err){setText('operationsStatus',err.message||'Gagal memuat operasional.');}).getOperationsSetup(state.page,getValue('operationSearch'));
  }
  function changeOperationsPage(delta){openOperations(Math.max(1,auditUiState().page+delta));}
  function invalidateOperationReference(){var s=auditUiState();s.reference=null;s.referenceSeq++;setText('operationReferenceInfo','Muat referensi sebelum menyimpan.');if(['SALE_RETURN','PICKUP_CORRECT'].indexOf(getValue('operationKind'))>=0)setHtml('operationItems','');}
  function operationSourceChanged(){document.getElementById('operationSalesGroup').hidden=!(getValue('operationKind')==='RETURN_HELD'||getValue('operationKind')==='STOCK_COUNT'&&getValue('operationSource')==='SALES');}
  function operationKindChanged(){
    var kind=getValue('operationKind'),ref=['SALE_RETURN','INVOICE_VOID','PICKUP_CORRECT','DEPOSIT_CORRECT'].indexOf(kind)>=0;invalidateOperationReference();
    document.getElementById('operationReferenceGroup').hidden=!ref;document.getElementById('operationDistributorGroup').hidden=ref;document.getElementById('operationSourceGroup').hidden=kind!=='STOCK_COUNT';document.getElementById('operationAmountGroup').hidden=kind!=='DEPOSIT_CORRECT';document.getElementById('operationItemsGroup').hidden=['INVOICE_VOID','DEPOSIT_CORRECT'].indexOf(kind)>=0;document.getElementById('operationAddItem').hidden=ref;
    operationSourceChanged();auditUiState().countPreview=null;document.getElementById('operationCountGroup').hidden=kind!=='STOCK_COUNT';setText('operationCountPreview','Periksa saldo sebelum menyimpan opname.');setHtml('operationItems','');setText('operationQuantityLabel',['STOCK_COUNT','PICKUP_CORRECT'].indexOf(kind)>=0?'Jumlah saldo yang benar':'Jumlah');
    setText('operationPolicy',kind==='SALE_RETURN'?'Retur memakai harga faktur asal dan mengurangi omzet. Barang baik kembali ke sumber stok asal; barang rusak dipisahkan.':kind==='INVOICE_VOID'?'Hanya sisa barang yang belum diretur yang dikembalikan. Faktur asal tetap tersedia dalam riwayat.':kind==='RETURN_HELD'?'Barang baik kembali ke gudang distributor asal. Retur pegangan tidak menambah atau mengurangi omzet.':kind==='PICKUP_CORRECT'?'Isi jumlah pengambilan yang benar. Isi semua produk 0 untuk membatalkan; stok pegangan harus masih mencukupi.':kind==='STOCK_COUNT'?'Isi saldo fisik yang benar. Selisih dicatat sebagai mutasi beralasan.':kind==='DEPOSIT_CORRECT'?'Isi nominal yang benar, atau 0 untuk membatalkan memo setoran.':'Penerimaan barang menambah stok gudang distributor terpilih.');
    if(!ref)addOperationalItem();var data=auditUiState().data;if(data){var name=kind==='PICKUP_CORRECT'?'STOCK_PICKUPS':kind==='DEPOSIT_CORRECT'?'SALES_CASH_DEPOSITS':'SALES_TRANSACTIONS';setHtml('operationReferenceOptions',(data.references||[]).filter(function(x){return x.type===name;}).map(function(x){return '<option value="'+escapeHtml(x.id)+'">'+escapeHtml(x.date+' · '+x.name)+'</option>';}).join(''));}
  }
  function addOperationalItem(ref){
    if(!auditAdmin())return;var state=auditUiState(),body=document.getElementById('operationItems');if(body.children.length>=100)return showToast('Maksimal 100 baris produk.','error');var kind=getValue('operationKind'),row=document.createElement('tr');
    if(ref){row.dataset.referenceKey=ref.key;row.dataset.originalQty=String(ref.qty);}
    row.innerHTML='<td>'+(ref?escapeHtml(ref.productName)+'<br><small>'+escapeHtml(ref.sourceType==='SALES'?'Sumber: pegangan sales':'Sumber: gudang')+' · '+escapeHtml(ref.distributorId)+' · Sisa '+ref.remaining+'</small>':'<select class="form-control operation-product" aria-label="Produk">'+auditOptions(state.data?state.data.products.filter(function(p){return kind!=='STOCK_IN'||normalizeKey(p.status||'ACTIVE')==='ACTIVE';}):[],'product_id','product_name')+'</select>')+'</td><td><input class="form-control operation-qty" aria-label="Jumlah produk" type="number" required min="'+(ref||kind==='STOCK_COUNT'?'':1)+'" step="1" value="'+(ref?kind==='PICKUP_CORRECT'?ref.qty:0:kind==='STOCK_COUNT'?'':1)+'"'+(ref&&kind==='SALE_RETURN'?' max="'+ref.remaining+'"':'')+'></td><td>'+(['RETURN_HELD','SALE_RETURN'].indexOf(kind)>=0?'<select class="form-control operation-condition" aria-label="Kondisi barang"><option value="GOOD">Baik / layak jual</option><option value="DAMAGED">Rusak / tidak layak jual</option></select>':'—')+'</td><td>'+(ref?'':'<button type="button" class="btn btn-danger-soft btn-sm" onclick="this.closest(\'tr\').remove()">Hapus</button>')+'</td>';body.appendChild(row);
  }
  function loadOperationalReference(){
    if(!auditCanWrite())return;var state=auditUiState(),seq=++state.referenceSeq,kind=getValue('operationKind'),id=getValue('operationReference');state.reference=null;setText('operationReferenceInfo','Memuat referensi…');
    auditSafeRunner(function(r){try{auditCheckResponse(r);if(seq!==auditUiState().referenceSeq||kind!==getValue('operationKind')||id!==getValue('operationReference'))return;state.reference=r.reference;setText('operationReferenceInfo',r.reference.salesName+' · '+formatDateIndo(r.reference.date)+(r.reference.voided?' · Sudah dibatalkan':''));setHtml('operationItems','');if(kind==='DEPOSIT_CORRECT')setValue('operationAmount',r.reference.amount);else if(kind!=='INVOICE_VOID')r.reference.items.forEach(addOperationalItem);}catch(err){setText('operationReferenceInfo',err.message);}},function(err){if(seq===auditUiState().referenceSeq)setText('operationReferenceInfo',err.message);}).getOperationsReference(kind,id);
  }
  function invalidateStockCountPreview(event){var t=event.target;if(getValue('operationKind')==='STOCK_COUNT'&&(t.closest('#operationItems')||['operationSales','operationDistributor','operationSource'].indexOf(t.id)>=0)){auditUiState().countPreview=null;setText('operationCountPreview','Hitungan atau pilihan berubah. Periksa saldo kembali.');}}
  function stockCountInput(){return {sourceType:getValue('operationSource'),salesId:getValue('operationSales'),distributor:getValue('operationDistributor'),items:Array.from(document.querySelectorAll('#operationItems tr')).map(function(row){var value=row.querySelector('.operation-qty').value;if(value==='')throw new Error('Isi hasil hitung fisik, termasuk 0 bila kosong.');var qty=Number(value);if(!Number.isSafeInteger(qty)||qty<0)throw new Error('Hasil hitung harus bilangan bulat nonnegatif.');return {productId:row.querySelector('.operation-product').value,targetQty:qty};})};}
  function previewStockCount(){
    if(!auditCanWrite())return;var input;try{input=stockCountInput();}catch(err){return showToast(err.message,'error');}var state=auditUiState(),signature=JSON.stringify(input);state.countPreview=null;setText('operationCountPreview','Memeriksa saldo sistem…');
    auditSafeRunner(function(r){try{auditCheckResponse(r);if(getValue('operationKind')!=='STOCK_COUNT'||signature!==JSON.stringify(stockCountInput()))return;state.countPreview={signature:signature,revision:r.revision};setText('operationCountPreview',r.items.map(function(i){return i.productName+': saldo sistem '+i.before+' → hasil hitung '+i.targetQty+' (selisih '+(i.delta>0?'+':'')+i.delta+')';}).join(' · '));}catch(err){setText('operationCountPreview',err.message);}},function(err){setText('operationCountPreview',err.message);}).getStockCountPreview(input);
  }
  function submitOperationalChange(event){
    if(event)event.preventDefault();if(!auditCanWrite())return;var kind=getValue('operationKind'),ref=auditUiState().reference,needs=['SALE_RETURN','INVOICE_VOID','PICKUP_CORRECT','DEPOSIT_CORRECT'].indexOf(kind)>=0;
    if(needs&&(!ref||ref.id!==getValue('operationReference')))return showToast('Muat referensi yang dipilih dahulu.','error');
    var payload={operation:'OPERATIONS',kind:kind,date:getValue('operationDate'),reason:getValue('operationReason'),salesId:getValue('operationSales'),distributor:getValue('operationDistributor'),sourceType:getValue('operationSource'),items:[]};
    if(needs){payload.referenceId=ref.id;payload.expectedRevision=ref.revision;}if(kind==='DEPOSIT_CORRECT')payload.amount=getValue('operationAmount');
    try{document.querySelectorAll('#operationItems tr').forEach(function(row){var qty=Number(row.querySelector('.operation-qty').value),item={};if(kind==='SALE_RETURN'&&qty===0)return;if(kind==='PICKUP_CORRECT'&&qty===Number(row.dataset.originalQty))return;if(!Number.isSafeInteger(qty)||qty<0)throw new Error('Jumlah harus bilangan bulat nonnegatif.');if(ref)item.key=row.dataset.referenceKey;else item.productId=row.querySelector('.operation-product').value;if(['STOCK_COUNT','PICKUP_CORRECT'].indexOf(kind)>=0)item.targetQty=qty;else item.qty=qty;var condition=row.querySelector('.operation-condition');if(condition)item.condition=condition.value;payload.items.push(item);});}catch(err){showToast(err.message,'error');return;}
    if(kind==='STOCK_COUNT'){var count=auditUiState().countPreview;if(!count||count.signature!==JSON.stringify(stockCountInput()))return showToast('Periksa saldo dan selisih opname dahulu.','error');payload.expectedRevision=count.revision;}
    if(payload.reason.trim().length<3)return showToast('Isi keterangan/alasan minimal 3 karakter.','error');auditBeginRequest(payload);
  }
  var masterFieldLabels={sales_id:'ID sales',full_name:'Nama lengkap',team_name:'Tim',area:'Area',target_monthly:'Target bulanan (Rp)',phone:'Telepon',email:'Email',photo_url:'URL foto profil',status:'Status',product_id:'Kode produk',product_name:'Nama produk',category:'Kategori',unit:'Satuan',brand:'Merek',min_stock:'Stok minimum',cost_price:'Modal (Rp)',selling_price:'Harga jual (Rp)',shj:'SHJ per produk (Rp)',distributor_id:'ID distributor',distributor_name:'Nama distributor',distributor_type:'Jenis distributor',date:'Tanggal libur',holiday_name:'Nama hari libur',file_name:'Nama dokumen',drive_url:'Tautan dokumen HTTPS',update_date:'Tanggal pembaruan'};
  function openMasterEditor(){
    if(!auditAdmin())return;var state=auditUiState(),seq=++state.masterSeq;setText('masterEditorStatus','Memuat master…');auditSafeRunner(function(r){try{auditCheckResponse(r);if(seq!==auditUiState().masterSeq)return;state.masters=r;masterTableChanged();setText('masterEditorStatus','Periode tersimpan: '+(r.periods.join(', ')||'Belum ada snapshot. Jalankan Perbarui Seluruh Sheet.'));if(appState.pendingTransaction)txClientLock(true);}catch(err){setText('masterEditorStatus',err.message);}},function(err){setText('masterEditorStatus',err.message);}).getMasterEditor();
  }
  function masterTableChanged(){var state=auditUiState();if(!state.masters)return;var t=state.masters.tables[getValue('masterTable')];setHtml('masterRecord','<option value="">Tambah catatan baru</option>'+t.rows.map(function(r){return '<option value="'+escapeHtml(r.key)+'">'+escapeHtml(r.data.full_name||r.data.product_name||r.data.distributor_name||r.data.holiday_name||r.data.file_name||r.key)+' · '+escapeHtml(r.key)+'</option>';}).join(''));renderMasterFields();}
  function renderMasterFields(){
    var state=auditUiState();if(!state.masters)return;var name=getValue('masterTable'),table=state.masters.tables[name],existing=table.rows.find(function(r){return r.key===getValue('masterRecord');}),record=existing?existing.data:{};
    setHtml('masterRecordFields',table.headers.filter(function(h){return masterFieldLabels[h];}).map(function(h){var value=record[h]===undefined?h==='status'?'ACTIVE':h==='min_stock'||h==='target_monthly'?0:'':record[h],id='masterField_'+h,input;
      if(h==='status')input='<select class="form-control" id="'+id+'"><option value="ACTIVE"'+(value==='ACTIVE'?' selected':'')+'>Aktif</option><option value="INACTIVE"'+(value==='INACTIVE'?' selected':'')+'>Nonaktif</option></select>';
      else if(h==='team_name'){var teams=(appState.teams||[]).map(function(t){return t.team_name;});if(name==='SALES')teams.push('SPR');input='<select class="form-control" id="'+id+'">'+Array.from(new Set(teams)).map(function(t){return '<option value="'+escapeHtml(t)+'"'+(normalizeKey(t)===normalizeKey(value)?' selected':'')+'>'+escapeHtml(t)+'</option>';}).join('')+'</select>';}
      else {var numeric=['target_monthly','min_stock','cost_price','selling_price','shj'].indexOf(h)>=0,type=numeric?'number':h==='date'||h==='update_date'?'date':h==='email'?'email':'text',immutable=existing&&(['sales_id','product_id','distributor_id','file_name','date'].indexOf(h)>=0||name==='PRICE_MASTER'&&h==='team_name');input='<input id="'+id+'" class="form-control" type="'+type+'" value="'+escapeHtml(value)+'"'+(numeric?' step="'+(h==='min_stock'?'1':'0.01')+'"'+(h==='shj'?'':' min="0"'):' maxlength="2000"')+(immutable||h==='shj'||h==='update_date'?' readonly':'')+'>';}
      return '<div class="form-group"><label for="'+id+'">'+escapeHtml(masterFieldLabels[h])+'</label>'+input+'</div>';}).join(''));
    if(existing&&name==='PRICE_MASTER'){var team=document.getElementById('masterField_team_name');if(team)team.disabled=true;}
    document.getElementById('masterRemoveHoliday').hidden=!(name==='HOLIDAYS'&&existing);
  }
  function submitMasterRecord(event,remove){
    if(event)event.preventDefault();if(!auditCanWrite())return;var state=auditUiState(),name=getValue('masterTable'),table=state.masters&&state.masters.tables[name];if(!table)return;var old=table.rows.find(function(r){return r.key===getValue('masterRecord');}),data={};table.headers.forEach(function(h){var field=document.getElementById('masterField_'+h);data[h]=field?field.value:old?old.data[h]:'';});
    if(getValue('masterReason').trim().length<3)return showToast('Isi alasan perubahan master.','error');auditBeginRequest({operation:'MASTER',table:name,data:data,expectedRevision:old?old.revision:'',reason:getValue('masterReason'),remove:remove===true});
  }
  function loadHistoricalMasterSources(){if(!auditAdmin())return;var month=getValue('periodVerificationMonth'),state=auditUiState(),seq=(state.periodSeq||0)+1;state.periodSeq=seq;setText('periodVerificationStatus','Memuat sumber…');auditSafeRunner(function(r){try{auditCheckResponse(r);if(seq!==auditUiState().periodSeq||month!==getValue('periodVerificationMonth'))return;setHtml('periodVerificationSource',auditOptions(r.sources,'id','label'));showHistoricalSourceLink();setText('periodVerificationStatus',r.verified?'Master bulan ini sudah disahkan dan dikunci.':r.message);document.getElementById('btnVerifyPeriod').disabled=r.verified;}catch(err){setText('periodVerificationStatus',err.message);}}).getHistoricalMasterSources(month);}
  function showHistoricalSourceLink(){var link=document.getElementById('periodVerificationSourceLink'),id=getValue('periodVerificationSource');if(link){link.hidden=!id;link.href=id?'https://docs.google.com/spreadsheets/d/'+encodeURIComponent(id)+'/edit':'';}}
  function submitHistoricalMasterVerification(){if(!auditCanWrite())return;var month=getValue('periodVerificationMonth');if(getValue('periodVerificationConfirmation')!=='VERIFIKASI '+month)return showToast('Teks konfirmasi belum sesuai.','error');auditBeginRequest({operation:'PERIOD_VERIFY',month:month,sourceId:getValue('periodVerificationSource'),confirmation:getValue('periodVerificationConfirmation'),reason:getValue('periodVerificationReason')});}
  function openOperationalHealth(){
    if(!auditAdmin())return;var state=auditUiState(),seq=++state.healthSeq;setText('healthStatus','Memeriksa struktur, saldo dan pemulihan…');auditSafeRunner(function(r){try{auditCheckResponse(r);if(seq!==auditUiState().healthSeq)return;state.health=r;setText('healthRelease',r.release+' · '+r.environment+' · '+r.asOf+' WIB');setText('healthStatus','Pemeriksaan selesai · Locale sheet '+r.locale);setHtml('healthIssues',r.issues.map(function(i){return '<li class="health-'+(i.level==='ERROR'?'error':'warning')+'">'+escapeHtml(i.table)+': '+escapeHtml(i.message)+'</li>';}).join('')||'<li>Tidak ada masalah dari pemeriksaan otomatis ini.</li>');setText('healthChecks',r.checks.join(' · ')+(r.lastReportSync?' · Sheet insentif terakhir diperbarui '+r.lastReportSync+' WIB':'')+(r.lastBackupError?' · Backup gagal: '+r.lastBackupError:'')+(r.lastReportError?' · Update laporan gagal: '+r.lastReportError:''));
      setHtml('healthPending',r.pending.map(function(p){var code=escapeHtml(jsQuote(p.requestId));return '<tr><td>'+escapeHtml(p.requestId)+'</td><td>'+escapeHtml(p.createdAt)+'</td><td>'+escapeHtml(p.message)+'</td><td><button class="btn btn-outline btn-sm" type="button" onclick="inspectHealthRequest(\''+code+'\')">Periksa hasil</button>'+(p.canCancelReservation?' <button class="btn btn-danger-soft btn-sm" type="button" onclick="cancelHealthReservation(\''+code+'\')">Batalkan reservasi belum dikirim</button>':'')+'</td></tr>';}).join('')||'<tr><td colspan="4">Tidak ada kiriman tertunda.</td></tr>');
      setHtml('healthBackups',r.backups.map(function(b){return '<tr><td>'+escapeHtml(b.date)+'</td><td>'+escapeHtml(b.kind)+'</td><td>'+escapeHtml(b.status)+'</td><td><a target="_blank" rel="noopener noreferrer" href="'+escapeHtml(b.url)+'">Buka cadangan</a></td></tr>';}).join('')||'<tr><td colspan="4">Belum ada cadangan terverifikasi.</td></tr>');auditSetOptions('healthRestoreBackup',auditOptions(r.backups.filter(function(b){return b.status==='COMPLETE';}),'id','date'));if(appState.pendingTransaction)txClientLock(true);
    }catch(err){setText('healthStatus',err.message);}},function(err){setText('healthStatus',err.message);}).getOperationalHealth();
  }
  function inspectHealthRequest(id){if(!auditAdmin())return;auditSafeRunner(function(r){setText('healthStatus',r.message||'Status: '+r.state);if(appState.pendingTransaction&&appState.pendingTransaction.requestId===id&&r.terminal)txClientHandleResult(r);openOperationalHealth();}).inspectOperationalRequest(id);}
  function cancelHealthReservation(id){if(!auditAdmin())return;var reason=getValue('healthRecoveryReason');if(reason.trim().length<3)return showToast('Isi alasan pembatalan reservasi dahulu.','error');auditSafeRunner(function(r){setText('healthStatus',r.message);if(appState.pendingTransaction&&appState.pendingTransaction.requestId===id)txClientHandleResult(r);openOperationalHealth();}).recoverAbandonedReservation(id,reason);}
  function auditMaintenanceCall(action){if(!auditCanWrite())return;appState.maintenanceBusy=true;['btnCreateBackup','btnPrepareRestore'].forEach(function(id){var el=document.getElementById(id);if(el)el.disabled=true;});setText('healthStatus','Sedang memproses salinan privat…');var generation=kchAuthGeneration;function done(){if(generation!==kchAuthGeneration)return;appState.maintenanceBusy=false;['btnCreateBackup','btnPrepareRestore'].forEach(function(id){var el=document.getElementById(id);if(el)el.disabled=false;});}var r=auditSafeRunner(function(result){done();try{auditCheckResponse(result);action.success(result);}catch(err){setText('healthStatus',err.message);}},function(err){done();setText('healthStatus',err.message);});action.send(r);}
  function createBackupFromUi(){auditMaintenanceCall({send:function(r){r.createOperationalBackup(txClientNewId());},success:function(result){showToast(result.message,'success');openOperationalHealth();}});}
  function invalidateRestorePreview(){auditUiState().restore=null;setHtml('healthRestorePreview','');setText('healthRestoreMessage','');setValue('healthRestoreConfirmation','');var btn=document.getElementById('btnApplyRestore');if(btn)btn.disabled=true;}
  function prepareRestoreFromUi(){var id=getValue('healthRestoreBackup');if(!id)return showToast('Pilih cadangan dahulu.','error');invalidateRestorePreview();auditMaintenanceCall({send:function(r){r.prepareBackupRestore(id,txClientNewId());},success:function(result){if(getValue('healthRestoreBackup')!==id)return;auditUiState().restore=result;setText('healthRestoreMessage',result.message);setText('healthRestoreConfirmationLabel','Ketik: '+result.confirmation);setHtml('healthRestorePreview','<table class="app-table"><thead><tr><th>Bagian data usaha</th><th>Baris dalam cadangan</th></tr></thead><tbody>'+result.tables.map(function(t){return '<tr><td>'+escapeHtml(t.name)+'</td><td>'+t.rows+'</td></tr>';}).join('')+'</tbody></table>');document.getElementById('btnApplyRestore').disabled=!result.canRestore;setText('healthStatus','Pratinjau siap. Production belum diubah.');}});}
  function createRecoveryCopyFromUi(){var id=getValue('healthRestoreBackup');if(!id)return showToast('Pilih cadangan dahulu.','error');auditMaintenanceCall({send:function(r){r.createRecoveryCopy(id);},success:function(result){setText('healthStatus',result.message);var el=document.getElementById('healthRestoreMessage');el.textContent='';var link=document.createElement('a');link.href=result.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Buka salinan pemulihan terpisah';el.appendChild(link);}});}
  function submitRestoreFromUi(){var r=auditUiState().restore;if(!r||!r.canRestore)return showToast('Siapkan pratinjau yang valid dahulu.','error');if(getValue('healthRestoreConfirmation')!==r.confirmation)return showToast('Teks konfirmasi belum sesuai.','error');auditBeginRequest({operation:'RESTORE',backupId:r.backupId,rollbackBackupId:r.rollbackBackupId,expectedRevision:r.expectedRevision,confirmation:getValue('healthRestoreConfirmation'),reason:getValue('healthRestoreReason')});}
  function auditOperationCommitted(result){
    if(result.operation==='OPERATIONS'){auditUiState().reference=null;setValue('operationReason','');operationKindChanged();openOperations(1);}
    else if(result.operation==='MASTER'){setValue('masterReason','');openMasterEditor();}
    else if(result.operation==='PERIOD_VERIFY'){setValue('periodVerificationConfirmation','');loadHistoricalMasterSources();}
    else if(result.operation==='RESTORE'){invalidateRestorePreview();appState.privatePhotos=null;openOperationalHealth();}
    loadMetadata();showToast(result.message,'success');
  }

  var kchAuditSyncTimer=null;
  function stopAuditSync(){if(kchAuditSyncTimer!==null)clearTimeout(kchAuditSyncTimer);kchAuditSyncTimer=null;}
  function auditSyncCanRefresh(){
    if(!appState.user||document.hidden||appState.pendingTransaction||appState.isSubmittingTransaction||appState.maintenanceBusy||appState.isLoadingMetadata)return false;
    if(['input-tx','pengambilan','operasional','master-admin','monitor-admin','skor','today-plan','weekly-meeting','kch-news'].indexOf(appState.currentView)>=0)return false;
    return !Array.from(document.querySelectorAll('.modal-backdrop')).some(function(el){return getComputedStyle(el).display!=='none';});
  }
  function startAuditSync(){
    if(kchAuditSyncTimer!==null||!appState.user)return;var generation=kchAuthGeneration;
    kchAuditSyncTimer=setTimeout(function poll(){kchAuditSyncTimer=null;if(generation!==kchAuthGeneration||!appState.user)return;
      if(!auditSyncCanRefresh()){startAuditSync();return;}
      auditSafeRunner(function(result){
        if(!result||!result.success){startAuditSync();return;}
        if(appState.syncVersion!==result.version){appState.syncVersion=result.version;
          if(auditSyncCanRefresh())loadMetadata(function(){if(appState.currentView==='riwayat')loadTransactions(appState.transactionPage||1);if(appState.currentView==='laporan-bulanan')loadMonthlyTeamReport();if(appState.currentView==='insentif')loadIncentiveReport();});
        }
        startAuditSync();
      },function(){setText('dashboardLoadStatus','Sinkronisasi tertunda · terakhir '+(appState.lastSyncAt||'—')+' WIB');startAuditSync();}).getSyncStatus();
    },60000);
  }
</script>
