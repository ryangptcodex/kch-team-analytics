<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
  var kchFirebaseAuth = null;
  var kchGuestToken = '';
  var kchGuestLoginPending = false;
  var kchAuthGeneration = 0;
  var kchAccessLoadVersion = 0;
  var kchSigningOut = false;
  var kchInitialAppState = null;
  var kchInitialUi = [];

  function captureKchInitialUi() {
    if (kchInitialAppState !== null) return;
    kchInitialAppState = JSON.stringify(appState);
    var selector = '.app-layout, .modal-backdrop, #kchAccessPanel, #toastBox';
    document.querySelectorAll(selector).forEach(function(node) {
      // Capture each root once, without taking duplicate nested snapshots.
      if (node.parentElement && node.parentElement.closest(selector)) return;
      kchInitialUi.push({ current: node, template: node.cloneNode(true) });
    });
  }

  function resetKchSessionUi() {
    kchAccessLoadVersion++;
    document.body.classList.remove('kch-readonly');
    if (appState.txSearchTimer) clearTimeout(appState.txSearchTimer);
    Object.keys(appState.charts || {}).forEach(function(name) {
      try { appState.charts[name].destroy(); } catch (err) {}
    });
    if (kchInitialAppState !== null) appState = JSON.parse(kchInitialAppState);
    kchInitialUi.forEach(function(snapshot) {
      var clean = snapshot.template.cloneNode(true);
      snapshot.current.replaceWith(clean);
      snapshot.current = clean;
    });
    document.body.style.overflow = '';
  }

  function showKchAuthError(message) {
    document.body.classList.add('kch-locked');
    document.getElementById('kchAuthScreen').hidden = false;
    document.getElementById('kchAuthMessage').textContent = String(message || 'Silakan masuk kembali.');
  }

  // Obtain a fresh Firebase ID token for every RPC. The server independently
  // verifies it and rereads ACCESS_USERS; hiding controls is not authorization.
  function kchRun() {
    var success = function() {};
    var failure = function(err) { showToast(err.message || 'Permintaan gagal.', 'error'); };
    var generation = kchAuthGeneration;
    var proxy;
    proxy = new Proxy({}, { get: function(target, method) {
      if (method === 'withSuccessHandler') return function(fn) { success = fn; return proxy; };
      if (method === 'withFailureHandler') return function(fn) { failure = fn; return proxy; };
      return function() {
        var args = Array.prototype.slice.call(arguments);
        var current = kchFirebaseAuth && kchFirebaseAuth.currentUser;
        function fail(err) {
          if (generation !== kchAuthGeneration) return;
          var message = err && err.message ? err.message : 'Permintaan gagal.';
          if (/AUTH_REQUIRED:|ACCESS_DENIED:/.test(message)) {
            if (kchGuestToken && /AUTH_REQUIRED:/.test(message)) { kchGuestToken = ''; kchAuthGeneration++; resetKchSessionUi(); showKchAuthError(message); return; }
            showKchAuthError(message);
          }
          failure(err || new Error(message));
        }
        if (!current && !kchGuestToken) { fail(new Error('AUTH_REQUIRED: Silakan masuk kembali.')); return; }
        var authToken = kchGuestToken ? Promise.resolve(kchGuestToken) : current.getIdToken();
        authToken.then(function(token) {
          if (generation !== kchAuthGeneration) return;
          google.script.run.withSuccessHandler(function(result) {
            if (generation === kchAuthGeneration) success(result);
          }).withFailureHandler(fail).kchApi(token, String(method), args);
        }).catch(fail);
      };
    } });
    return proxy;
  }

  function initKchAuthentication() {
    captureKchInitialUi();
    if (!window.firebase || !window.KCH_FIREBASE_CONFIG) {
      showKchAuthError('Login Google belum dapat dimuat. Tamu dapat menggunakan username dan password.');
      return;
    }
    firebase.initializeApp(window.KCH_FIREBASE_CONFIG);
    kchFirebaseAuth = firebase.auth();
    kchFirebaseAuth.languageCode = 'id';
    // No Firebase refresh token is persisted to browser storage by this app.
    kchFirebaseAuth.setPersistence(firebase.auth.Auth.Persistence.NONE).then(function() {
      document.getElementById('kchGoogleLogin').disabled = false;
      kchFirebaseAuth.onAuthStateChanged(handleKchAuthState);
    }).catch(function(err) { showKchAuthError('Login Google belum siap. Tamu dapat menggunakan username dan password. ' + err.message); });
  }

  function handleKchAuthState(user) {
    if (kchSigningOut || kchGuestToken || kchGuestLoginPending) return;
    kchAuthGeneration++;
    resetKchSessionUi();
    if (!user) { showKchAuthError('Silakan masuk sebagai Tamu atau gunakan Google khusus Admin.'); return; }
    showKchAuthError('Memeriksa akses akun…');
    kchRun().withSuccessHandler(function(result) {
      enterKchSession(result);
    }).withFailureHandler(function(err) { showKchAuthError(err.message); }).getAuthProfile();
  }

  function enterKchSession(result) {
    appState.user = result.user;
    document.body.classList.remove('kch-locked');
    document.getElementById('kchAuthScreen').hidden = true;
    installKchAccountActions(result.user);
    initApp();
  }

  function toggleKchGuestLogin() {
    var form = document.getElementById('kchGuestLoginForm');
    form.hidden = !form.hidden;
    document.getElementById('kchGuestLoginToggle').setAttribute('aria-expanded', String(!form.hidden));
    if (!form.hidden) document.getElementById('kchGuestUsername').focus();
  }

  function signInKchGuest(event) {
    event.preventDefault();
    if (kchGuestLoginPending || kchSigningOut) return;
    var username = document.getElementById('kchGuestUsername').value.trim();
    var password = document.getElementById('kchGuestPassword').value;
    var button = document.getElementById('kchGuestLoginSubmit');
    var generation = ++kchAuthGeneration;
    kchGuestLoginPending = true; button.disabled = true;
    document.getElementById('kchGuestPassword').value = '';
    showKchAuthError('Memeriksa akun Tamu…');
    google.script.run.withSuccessHandler(function(result) {
      if (generation !== kchAuthGeneration) {
        if (result && result.token) google.script.run.withFailureHandler(function() {}).kchGuestLogout(result.token);
        return;
      }
      kchGuestLoginPending = false; button.disabled = false;
      if (!result || !result.success || !result.token || !result.user || result.user.role !== 'GUEST') { showKchAuthError('Login Tamu gagal. Silakan coba lagi.'); return; }
      resetKchSessionUi(); kchGuestToken = result.token;
      enterKchSession(result);
    }).withFailureHandler(function(err) {
      if (generation !== kchAuthGeneration) return;
      kchGuestLoginPending = false; button.disabled = false;
      showKchAuthError(err.message || 'Login Tamu gagal. Silakan coba lagi.');
    }).kchGuestLogin(username, password);
  }

  function signInKchGoogle() {
    if (!kchFirebaseAuth || kchSigningOut || kchGuestLoginPending) return;
    var provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    document.getElementById('kchGoogleLogin').disabled = true;
    var attemptGeneration = kchAuthGeneration;
    // Open directly from the click gesture so browsers can allow the popup.
    return kchFirebaseAuth.signInWithPopup(provider).then(function(result) {
      // Selecting the same Firebase user may not emit an auth-state event.
      // Recheck access without requiring a separate account-switch button.
      if (attemptGeneration === kchAuthGeneration) handleKchAuthState(result.user);
    }).catch(function(err) {
      var message = err.message || 'Login Google gagal.';
      if (err.code === 'auth/unauthorized-domain') {
        message = 'Domain aplikasi belum diizinkan di Firebase Authentication → Settings → Authorized domains. Tambahkan hostname: ' + window.location.hostname;
      } else if (err.code === 'auth/popup-blocked') {
        message = 'Izinkan popup untuk aplikasi ini lalu klik Masuk dengan Google lagi.';
      }
      showKchAuthError(message);
    }).finally(function() { document.getElementById('kchGoogleLogin').disabled = false; });
  }

  function signOutKch() {
    if (kchSigningOut) return;
    kchSigningOut = true;
    var guestToken = kchGuestToken; kchGuestToken = '';
    kchGuestLoginPending = false;
    document.getElementById('kchGuestPassword').value = '';
    document.getElementById('kchGuestUsername').value = '';
    document.getElementById('kchGuestLoginSubmit').disabled = false;
    kchAuthGeneration++;
    resetKchSessionUi();
    showKchAuthError('Keluar dari akun…');
    document.getElementById('kchGoogleLogin').disabled = true;
    if (guestToken) {
      return new Promise(function(resolve) {
        function done() { kchSigningOut = false; showKchAuthError('Sudah keluar. Silakan masuk kembali.'); document.getElementById('kchGoogleLogin').disabled = !kchFirebaseAuth; resolve(); }
        google.script.run.withSuccessHandler(done).withFailureHandler(done).kchGuestLogout(guestToken);
      });
    }
    if (!kchFirebaseAuth) {
      kchSigningOut = false;
      showKchAuthError('Komponen login belum siap. Muat ulang halaman aplikasi dari tab browser.');
      return;
    }
    // Keep the Apps Script iframe in place. Reloading its internal URL can
    // produce a blank page; auth state and account data are cleared locally.
    return Promise.resolve().then(function() { return kchFirebaseAuth.signOut(); }).then(function() {
      kchSigningOut = false;
      showKchAuthError('Sudah keluar. Silakan masuk dengan Google.');
      document.getElementById('kchGoogleLogin').disabled = false;
    }).catch(function() {
      kchSigningOut = false;
      showKchAuthError('Belum berhasil keluar. Silakan masuk kembali dengan Google untuk memilih akun.');
      document.getElementById('kchGoogleLogin').disabled = false;
    });
  }

  function installKchAccountActions(user) {
    if (document.body) { if (user.role === 'GUEST') document.body.classList.add('kch-readonly'); else document.body.classList.remove('kch-readonly'); }
    var roleLabel = document.querySelector('.user-role-header');
    if (roleLabel) roleLabel.textContent = user.role === 'ADMIN' ? 'TEAM LEADER' : user.role === 'GUEST' ? 'Tamu' : 'Sales';
    var menu = document.getElementById('userDropdownMenu');
    if (!menu || document.getElementById('kchLogoutAction')) return;
    if (user.role !== 'GUEST') {
    var profile = document.createElement('button');
    profile.type = 'button'; profile.className = 'dropdown-menu-item';
    profile.textContent = 'Edit profil'; profile.onclick = openKchProfile;
    menu.appendChild(profile);
    }
    if (user.role === 'ADMIN') {
      var access = document.createElement('button');
      access.type = 'button'; access.className = 'dropdown-menu-item';
      access.textContent = 'Kelola akun'; access.onclick = openKchAccessPanel;
      menu.appendChild(access);
    }
    var logout = document.createElement('button');
    logout.type = 'button'; logout.className = 'dropdown-menu-item'; logout.id = 'kchLogoutAction';
    logout.textContent = 'Keluar akun'; logout.onclick = signOutKch; menu.appendChild(logout);
  }

  function openKchProfile() {
    if (!appState.user) return;
    document.getElementById('kchProfileName').value = appState.user.fullName || '';
    document.getElementById('kchProfileEmail').value = appState.user.email || '';
    document.getElementById('kchProfileMessage').textContent = '';
    document.getElementById('kchSaveProfile').disabled = false;
    document.getElementById('userDropdownMenu').style.display = 'none';
    document.getElementById('modalKchProfile').style.display = 'flex';
    document.getElementById('kchProfileName').focus();
  }

  function closeKchProfile() {
    document.getElementById('modalKchProfile').style.display = 'none';
  }

  function saveKchProfile(event) {
    event.preventDefault();
    var button = document.getElementById('kchSaveProfile');
    if (button.disabled) return;
    var name = document.getElementById('kchProfileName').value.trim();
    var message = document.getElementById('kchProfileMessage');
    if (name.length < 2 || name.length > 80) { message.textContent = 'Isi nama tampilan sepanjang 2–80 karakter.'; return; }
    button.disabled = true;
    message.textContent = 'Menyimpan nama tampilan…';
    kchRun().withSuccessHandler(function(result) {
      button.disabled = false;
      if (!result || !result.success || !result.user) {
        message.textContent = result && result.message || 'Nama tampilan belum berhasil disimpan.'; return;
      }
      appState.user = result.user;
      updateDynamicGreeting();
      closeKchProfile();
      showToast('Nama tampilan berhasil disimpan.', 'success');
    }).withFailureHandler(function(err) {
      button.disabled = false;
      message.textContent = err.message || 'Nama tampilan gagal disimpan. Silakan coba lagi.';
    }).saveMyProfile({ displayName: name });
  }

  function openKchAccessPanel() {
    document.getElementById('kchAccessPanel').hidden = false;
    loadKchAccessUsers();
  }

  function loadKchAccessUsers() {
    var version = ++kchAccessLoadVersion;
    var save = document.getElementById('kchSaveAccess');
    var message = document.getElementById('kchAccessMessage');
    save.disabled = true;
    document.getElementById('kchAccessRows').replaceChildren();
    message.textContent = 'Sedang memuat data';
    kchRun().withSuccessHandler(function(result) {
      if (version !== kchAccessLoadVersion) return;
      if (!result || !result.success || !Array.isArray(result.users) || result.users.length !== 2 ||
          result.users.filter(function(u) { return u.role === 'GUEST'; }).length !== 1) {
        message.textContent = 'Daftar akun tidak lengkap. Muat ulang sebelum mengubah status.'; return;
      }
      var guest = result.users.filter(function(u) { return u.role === 'GUEST'; })[0];
      document.getElementById('kchAccessEmail').value = guest.email;
      document.getElementById('kchAccessStatus').value = guest.status;
      document.getElementById('kchAccessUsername').value = guest.username || 'tamu';
      document.getElementById('kchAccessPassword').value = '';
      document.getElementById('kchAccessPassword').required = !guest.configured || !guest.passwordRecorded;
      var body = document.getElementById('kchAccessRows');
      result.users.forEach(function(user) {
        var row = document.createElement('tr');
        [user.role === 'GUEST' ? (user.username || 'Belum diatur') : user.email, user.role === 'GUEST' ? 'Tamu · hanya lihat' : 'Admin · akses penuh', user.status].forEach(function(value) {
          var cell = document.createElement('td'); cell.textContent = value; row.appendChild(cell);
        });
        body.appendChild(row);
      });
      save.disabled = false;
      if (!guest.passwordRecorded) { message.textContent = 'Password belum tersimpan sebagai teks di ACCESS_USERS. Isi kembali password Tamu di kolom Password baru lalu Simpan akses.'; return; }
      message.textContent = 'Google hanya untuk Admin. Atur username/password Tamu di sini. Kosongkan password untuk mempertahankannya; minimal 12 karakter jika diganti.';
    }).withFailureHandler(function(err) {
      if (version !== kchAccessLoadVersion) return;
      message.textContent = 'Gagal memuat akun: ' + err.message;
    }).listAccessUsers();
  }

  function saveKchAccess(event) {
    event.preventDefault();
    var save = document.getElementById('kchSaveAccess');
    if (save.disabled) return;
    save.disabled = true;
    kchRun().withSuccessHandler(function(result) {
      if (!result || !result.success) { save.disabled = false; document.getElementById('kchAccessMessage').textContent = result && result.message || 'Status gagal disimpan.'; return; }
      document.getElementById('kchAccessPassword').value = ''; showToast('Akun Tamu disimpan.', 'success'); loadKchAccessUsers();
    }).withFailureHandler(function(err) {
      save.disabled = false;
      document.getElementById('kchAccessMessage').textContent = err.message;
    }).saveGuestCredentials({ username: document.getElementById('kchAccessUsername').value, password: document.getElementById('kchAccessPassword').value, status: document.getElementById('kchAccessStatus').value });
  }
</script>
